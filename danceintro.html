<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>DANCE INTRO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
overflow:hidden;
height:100vh;
}

#bgVideo{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
filter:blur(35px) brightness(.3);
transform:scale(1.2);
z-index:-2;
pointer-events:none;
}

#bgVideo iframe{
width:100%;
height:100%;
border:none;
pointer-events:none;
}

body::after{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,.25);
z-index:-1;
}

#transition{
position:fixed;
inset:0;
background:black;
z-index:999;
animation:open 3s forwards;
}

@keyframes open{
to{
opacity:0;
visibility:hidden;
}
}

#startText{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:50px;
letter-spacing:8px;
color:white;
z-index:1000;
transition:2s;
}

.frame{
position:absolute;
overflow:hidden;
border:3px solid white;
opacity:0;
animation:appear 2s forwards;
}

@keyframes appear{
to{ opacity:1; }
}

.frame iframe{
width:100%;
height:100%;
border:none;
pointer-events:none;
}

.center{
left:40%;
top:2%;
width:18vw;
height:70vh;
z-index:50;
animation-delay:2s;
}

.v1{
left:4%;
top:18%;
width:32vw;
height:38vh;
transform:rotate(-25deg);
animation-delay:2.3s;
}

.v2{
right:4%;
top:18%;
width:32vw;
height:38vh;
transform:rotate(25deg);
animation-delay:2.5s;
}

.v3{
left:26%;
bottom:2%;
width:42vw;
height:25vh;
animation-delay:2.7s;
}

.v4{
right:3%;
bottom:0;
width:24vw;
height:26vh;
animation-delay:2.8s;
}

.v5{
left:0;
top:0;
width:14vw;
height:32vh;
animation-delay:3s;
}

.v6{
right:0;
top:0;
width:14vw;
height:32vh;
animation-delay:3.1s;
}

.v7{
left:8%;
bottom:0;
width:18vw;
height:20vh;
animation-delay:3.2s;
}

.v8{
right:18%;
bottom:18%;
width:14vw;
height:18vh;
animation-delay:3.3s;
}

.v9{
left:53%;
top:60%;
width:14vw;
height:18vh;
animation-delay:3.4s;
}

.v10{
right:0;
top:50%;
width:18vw;
height:18vh;
animation-delay:3.5s;
}

#final{
position:fixed;
inset:0;
background:black;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:99999;
opacity:0;
transition:3s;
text-align:center;
}

</style>

</head>

<body>

<audio id="music">
  <source src="music/euphoria.mp3">
</audio>

<!-- FUNDO -->
<div id="bgVideo">
  <iframe src="https://www.youtube.com/embed/IfurZy0ckcc?autoplay=1&mute=1&loop=1&playlist=IfurZy0ckcc&controls=0&showinfo=0&modestbranding=1" allow="autoplay"></iframe>
</div>

<div id="transition"></div>
<div id="startText">EVERY MEMORY LEADS HERE</div>

<!-- QUADROS -->
<div class="frame v1"><iframe src="https://www.youtube.com/embed/IfurZy0ckcc?autoplay=1&mute=1&loop=1&playlist=IfurZy0ckcc&controls=0&showinfo=0&modestbranding=1" allow="autoplay"></iframe></div>
<div class="frame v2"><iframe src="https://www.youtube.com/embed/zCtRk1oDOKI?autoplay=1&mute=1&loop=1&playlist=zCtRk1oDOKI&controls=0&showinfo=0&modestbranding=1" allow="autoplay"></iframe></div>
<div class="frame v3"><iframe src="https://www.youtube.com/embed/q86HF4qWQu0?autoplay=1&mute=1&loop=1&playlist=q86HF4qWQu0&controls=0&showinfo=0&modestbranding=1" allow="autoplay"></iframe></div>
<div class="frame v4"><iframe src="https://www.youtube.com/embed/xDWO2dk3d08?autoplay=1&mute=1&loop=1&playlist=xDWO2dk3d08&controls=0&showinfo=0&modestbranding=1" allow="autoplay"></iframe></div>
<div class="frame v5"><iframe src="https://www.youtube.com/embed/aabzHbj-wOY?autoplay=1&mute=1&loop=1&playlist=aabzHbj-wOY&controls=0&showinfo=0&modestbranding=1" allow="autoplay"></iframe></div>
<div class="frame v6"><iframe src="https://www.youtube.com/embed/ujTwQAluTlQ?autoplay=1&mute=1&loop=1&playlist=ujTwQAluTlQ&controls=0&showinfo=0&modestbranding=1" allow="autoplay"></iframe></div>
<div class="frame v7"><iframe src="https://www.youtube.com/embed/NELEUqaD87U?autoplay=1&mute=1&loop=1&playlist=NELEUqaD87U&controls=0&showinfo=0&modestbranding=1" allow="autoplay"></iframe></div>
<div class="frame v8"><iframe src="https://www.youtube.com/embed/b8jJRNhcsaA?autoplay=1&mute=1&loop=1&playlist=b8jJRNhcsaA&controls=0&showinfo=0&modestbranding=1" allow="autoplay"></iframe></div>
<div class="frame v9"><iframe src="https://www.youtube.com/embed/VHJPKDDJkPs?autoplay=1&mute=1&loop=1&playlist=VHJPKDDJkPs&controls=0&showinfo=0&modestbranding=1" allow="autoplay"></iframe></div>
<div class="frame v10"><iframe src="https://www.youtube.com/embed/ctpPoe9FZAg?autoplay=1&mute=1&loop=1&playlist=ctpPoe9FZAg&controls=0&showinfo=0&modestbranding=1" allow="autoplay"></iframe></div>

<!-- CENTRO -->
<div class="frame center">
  <iframe src="https://www.youtube.com/embed/UH6o_WIXnjI?autoplay=1&mute=1&loop=1&playlist=UH6o_WIXnjI&controls=0&showinfo=0&modestbranding=1" allow="autoplay"></iframe>
</div>

<div id="final"></div>

<script>

const music = document.getElementById("music")

music.currentTime = Number(localStorage.getItem("musicTime") || 0)
music.volume = .35
music.play().catch(()=>{})

setInterval(()=>{
  localStorage.setItem("musicTime", music.currentTime)
}, 500)

setTimeout(()=>{
  startText.style.opacity = "0"
}, 2000)

setTimeout(()=>{

  document.querySelectorAll(".frame").forEach(v=>{
    v.style.opacity = ".15"
  })

  const end = document.getElementById("final")
  end.style.display = "flex"

  setTimeout(()=>{ end.style.opacity = "1" }, 100)

  end.innerHTML = `
    <div style="font-size:52px;">THIS WEBSITE</div>
    <div style="font-size:30px;margin-top:20px;">WAS MADE FOR YOU</div>
  `

  setTimeout(()=>{
    end.innerHTML = `
      <div style="font-size:30px;">AS A GIFT</div>
      <div style="font-size:22px;margin-top:20px;">FROM THE BOYS</div>
    `
  }, 4000)

  setTimeout(()=>{
    end.innerHTML = `<div style="font-size:80px;">ENJOY</div>`
  }, 8000)

  setTimeout(()=>{
    localStorage.setItem("continueMusic", music.currentTime)
    window.location.href = "home.html"
  }, 12000)

}, 17000)

</script>

</body>
</html>
