<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>DANCE INTRO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
overflow:hidden;
height:100vh;
font-family:Arial;
}

#loading{
position:fixed;
inset:0;
background:black;
z-index:99999;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
gap:30px;
opacity:1;
transition:2s;
}

#loadingText{
font-size:18px;
letter-spacing:8px;
opacity:.6;
}

#loadingBar{
width:280px;
height:2px;
background:rgba(255,255,255,.15);
border-radius:99px;
overflow:hidden;
}

#loadingFill{
height:100%;
width:0%;
background:white;
border-radius:99px;
transition:.3s;
}

#bgVideo{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
filter:blur(35px) brightness(.3);
transform:scale(1.2);
z-index:-2;
pointer-events:none;
}

body::after{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,.25);
z-index:-1;
}

#curtain{
position:fixed;
inset:0;
background:black;
z-index:998;
opacity:1;
transition:2.5s ease;
pointer-events:none;
}

#startText{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:50px;
letter-spacing:8px;
color:white;
z-index:1000;
opacity:0;
transition:2s;
white-space:nowrap;
}

.frame{
position:absolute;
overflow:hidden;
border:3px solid white;
opacity:0;
transition:1.2s ease;
}

.frame video{
width:100%;
height:100%;
object-fit:cover;
pointer-events:none;
}

.center{ left:40%; top:2%; width:18vw; height:70vh; z-index:50; }
.v1{ left:4%; top:18%; width:32vw; height:38vh; transform:rotate(-25deg); }
.v2{ right:4%; top:18%; width:32vw; height:38vh; transform:rotate(25deg); }
.v3{ left:26%; bottom:2%; width:42vw; height:25vh; }
.v4{ right:3%; bottom:0; width:24vw; height:26vh; }
.v5{ left:0; top:0; width:14vw; height:32vh; }
.v6{ right:0; top:0; width:14vw; height:32vh; }
.v7{ left:8%; bottom:0; width:18vw; height:20vh; }
.v8{ right:18%; bottom:18%; width:14vw; height:18vh; }
.v9{ left:53%; top:60%; width:14vw; height:18vh; }
.v10{ right:0; top:50%; width:18vw; height:18vh; }

#final{
position:fixed;
inset:0;
background:black;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:99999;
opacity:0;
transition:3s;
text-align:center;
}

</style>
</head>

<body>

<audio id="music">
  <source src="music/euphoria.mp3">
</audio>

<!-- Vídeo de fundo desfocado -->
<video id="bgVideo" autoplay muted loop playsinline>
  <source src="https://res.cloudinary.com/dlcg5zzes/video/upload/v1781380219/center_xjkxjc.mp4">
</video>

<div id="loading">
  <div id="loadingText">LOADING</div>
  <div id="loadingBar"><div id="loadingFill"></div></div>
</div>

<div id="curtain"></div>
<div id="startText">EVERY MEMORY LEADS HERE</div>

<!-- Quadros animados -->
<div class="frame v1">
  <video autoplay muted loop playsinline><source src="https://res.cloudinary.com/dlcg5zzes/video/upload/v1781380259/video1_kbxqsj.mp4"></video>
</div>
<div class="frame v2">
  <video autoplay muted loop playsinline><source src="https://res.cloudinary.com/dlcg5zzes/video/upload/v1781380728/video2_tnoi2h.mp4"></video>
</div>
<div class="frame v3">
  <video autoplay muted loop playsinline><source src="https://res.cloudinary.com/dlcg5zzes/video/upload/v1781380244/video3_ozqczl.mp4"></video>
</div>
<div class="frame v4">
  <video autoplay muted loop playsinline><source src="https://res.cloudinary.com/dlcg5zzes/video/upload/v1781380249/video4_dxsakb.mp4"></video>
</div>
<div class="frame v5">
  <video autoplay muted loop playsinline><source src="https://res.cloudinary.com/dlcg5zzes/video/upload/v1781380258/video5_ho60t4.mp4"></video>
</div>
<div class="frame v6">
  <video autoplay muted loop playsinline><source src="https://res.cloudinary.com/dlcg5zzes/video/upload/v1781380276/video6_guyypn.mp4"></video>
</div>
<div class="frame v7">
  <video autoplay muted loop playsinline><source src="https://res.cloudinary.com/dlcg5zzes/video/upload/v1781380257/video7_itezl5.mp4"></video>
</div>
<div class="frame v8">
  <video autoplay muted loop playsinline><source src="https://res.cloudinary.com/dlcg5zzes/video/upload/v1781380729/video8_w0ctxc.mp4"></video>
</div>
<div class="frame v9">
  <video autoplay muted loop playsinline><source src="https://res.cloudinary.com/dlcg5zzes/video/upload/v1781380726/video9_t4q6it.mp4"></video>
</div>
<div class="frame v10">
  <video autoplay muted loop playsinline><source src="https://res.cloudinary.com/dlcg5zzes/video/upload/v1781380241/video10_smasin.mp4"></video>
</div>

<!-- Quadro central (destaque) -->
<div class="frame center">
  <video autoplay muted loop playsinline><source src="https://res.cloudinary.com/dlcg5zzes/video/upload/v1781380219/center_xjkxjc.mp4"></video>
</div>

<div id="final"></div>

<script>

const music = document.getElementById("music")
const loading = document.getElementById("loading")
const loadingFill = document.getElementById("loadingFill")
const curtain = document.getElementById("curtain")
const startText = document.getElementById("startText")
const frames = document.querySelectorAll(".frame")

music.currentTime = Number(localStorage.getItem("musicTime") || 0)
music.volume = .35
music.play().catch(()=>{})

setInterval(()=>{
  localStorage.setItem("musicTime", music.currentTime)
}, 500)

let progress = 0
const interval = setInterval(()=>{
  progress += 1
  if(progress >= 100){
    clearInterval(interval)
    startIntro()
  }
  loadingFill.style.width = progress + "%"
}, 100)

function startIntro(){

  loading.style.opacity = "0"
  setTimeout(()=>{ loading.style.display = "none" }, 2000)

  setTimeout(()=>{
    curtain.style.opacity = "0"
    setTimeout(()=>{ curtain.style.display = "none" }, 2500)
  }, 1800)

  setTimeout(()=>{ startText.style.opacity = "1" }, 2500)
  setTimeout(()=>{ startText.style.opacity = "0" }, 4500)

  const delays = [4000,4300,4500,4700,4800,5000,5100,5200,5300,5400,5500]
  frames.forEach((f,i)=>{
    setTimeout(()=>{ f.style.opacity = "1" }, delays[i] || 5500)
  })

  setTimeout(()=>{
    frames.forEach(v=>{ v.style.opacity = ".15" })
    const end = document.getElementById("final")
    end.style.display = "flex"
    setTimeout(()=>{ end.style.opacity = "1" }, 100)
    end.innerHTML = `
      <div style="font-size:52px;">THIS WEBSITE</div>
      <div style="font-size:30px;margin-top:20px;">WAS MADE FOR YOU</div>
    `
    setTimeout(()=>{
      end.innerHTML = `
        <div style="font-size:30px;">AS A GIFT</div>
        <div style="font-size:22px;margin-top:20px;">FROM THE BOYS</div>
      `
    }, 4000)
    setTimeout(()=>{
      end.innerHTML = `<div style="font-size:80px;">ENJOY</div>`
    }, 8000)
    setTimeout(()=>{
      localStorage.setItem("continueMusic", music.currentTime)
      localStorage.setItem("jaEntrou", "true")
      window.location.href = "home.html"
    }, 12000)
  }, 21000)
}

</script>

</body>
</html>
