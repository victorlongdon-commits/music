```html
<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>BTS Memory Film</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
overflow:hidden;
height:100vh;
font-family:Arial;
color:white;
}

#bg{

position:fixed;

inset:0;

background-size:cover;

background-position:center;

filter:brightness(.45);

transition:2s;

transform:scale(1.03);

}

#overlay{

position:fixed;

inset:0;

background:

linear-gradient(
90deg,
rgba(0,0,0,.2),
rgba(0,0,0,.8)
);

}

#member{

position:fixed;

right:0;

bottom:0;

height:95vh;

opacity:0;

transition:1.2s;

}

.show{

opacity:1 !important;

}

.content{

position:absolute;

left:8%;

top:50%;

transform:
translateY(-50%);

z-index:10;

opacity:0;

transition:1.2s;

max-width:700px;

}

h1{

font-size:100px;

margin-bottom:10px;

}

p{

font-size:24px;

opacity:.85;

}

.fade{

position:fixed;

inset:0;

background:black;

z-index:9999;

opacity:0;

transition:2s;

}

.text{

position:fixed;

top:50%;

left:50%;

transform:

translate(
-50%,
-50%
);

color:white;

font-size:48px;

letter-spacing:8px;

opacity:0;

transition:2s;

z-index:10000;

}

</style>

</head>

<body>

<audio id="music">

<source
src="music.mp3">

</audio>

<div id="bg"></div>

<div id="overlay"></div>

<img id="member">

<div
class="content"
id="content">

<h1 id="title">

2013

</h1>

<p id="subtitle">

The Beginning

</p>

</div>

<script>

/* MUSICA */

const music=

document.getElementById(
"music"
)

music.volume=.35

music.play()
.catch(()=>{})

setInterval(()=>{

localStorage.setItem(

"musicTime",

music.currentTime

)

},500)

/* CENAS */

const scenes=[

["2013",
"The Beginning",
"img1.jpg",
"member1.png"],

["THE STAGE",
"Every concert became memory",
"img2.jpg",
"member2.png"],

["THE LAUGHTER",
"Every laugh stayed",
"img3.jpg",
"member3.png"],

["BTS",
"Welcome",
"img4.jpg",
"member4.png"]

]

let i=0

const bg=
document.getElementById(
"bg"
)

const member=
document.getElementById(
"member"
)

const title=
document.getElementById(
"title"
)

const subtitle=
document.getElementById(
"subtitle"
)

const content=
document.getElementById(
"content"
)

function next(){

if(
i>=scenes.length
){

dramatic()

return

}

content.classList.remove(
"show"
)

member.classList.remove(
"show"
)

setTimeout(()=>{

bg.style.backgroundImage=

`url(${scenes[i][2]})`

member.src=

scenes[i][3]

title.innerText=

scenes[i][0]

subtitle.innerText=

scenes[i][1]

content.classList.add(
"show"
)

member.classList.add(
"show"
)

i++

},500)

setTimeout(
next,
3500
)

}

function dramatic(){

const fade=

document.createElement(
"div"
)

fade.className=
"fade"

document.body.appendChild(
fade
)

setTimeout(()=>{

fade.style.opacity=
"1"

},100)

setTimeout(()=>{

const txt=

document.createElement(
"div"
)

txt.className=
"text"

txt.innerText=

"EVERY MEMORY LEADS HERE"

document.body.appendChild(
txt
)

setTimeout(()=>{

txt.style.opacity=
"1"

},100)

},1800)

setTimeout(()=>{

window.location.href=

"danceintro.html"

},5000)

}

next()

</script>

</body>

</html>
