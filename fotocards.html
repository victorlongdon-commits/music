<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fotocards</title>
<style>

*{ margin:0; padding:0; box-sizing:border-box; }

body{
font-family:Arial;
background:linear-gradient(180deg,#06060a,#170b2c);
color:white;
min-height:100vh;
overflow-x:hidden;
}

/* NAV */
nav{
height:65px;
display:flex;
align-items:center;
padding:0 30px;
border-bottom:1px solid rgba(255,255,255,.1);
gap:20px;
position:sticky;
top:0;
background:rgba(6,6,10,.9);
backdrop-filter:blur(20px);
z-index:100;
}

.navBack{
font-size:22px;
cursor:pointer;
opacity:.7;
transition:.2s;
text-decoration:none;
color:white;
}
.navBack:hover{ opacity:1; }

nav h1{ font-size:20px; flex:1; }

.navBtns{ display:flex; gap:10px; }

.navBtn{
padding:8px 18px;
border:none;
border-radius:20px;
cursor:pointer;
font-size:14px;
transition:.2s;
}

.navBtnPrimary{ background:#7c5cff; color:white; }
.navBtnSecondary{ background:rgba(255,255,255,.1); color:white; }
.navBtnSecondary:hover{ background:rgba(255,255,255,.2); }
.navBtnFav{ background:rgba(255,80,80,.15); color:#ff6b6b; border:1px solid rgba(255,80,80,.3); }
.navBtnFav:hover{ background:rgba(255,80,80,.25); }

/* VIEWS */
#viewAlbums, #viewCards, #viewFavs{ display:none; }
#viewAlbums.active, #viewCards.active, #viewFavs.active{ display:block; }

/* SECTION HEADER */
.sectionHeader{
padding:30px 30px 10px;
display:flex;
align-items:center;
justify-content:space-between;
}

.sectionHeader h2{ font-size:22px; opacity:.9; }

/* ALBUM GRID */
.albumGrid{
display:grid;
grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
gap:20px;
padding:20px 30px 40px;
width:100%;
align-items:start;
}

.albumCard{
border-radius:16px;
overflow:hidden;
cursor:pointer;
transition:.3s;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);
position:relative;
height:fit-content;
}

.albumCard:hover{ transform:scale(1.04); border-color:rgba(124,92,255,.5); }

.albumCard img{
width:100%;
aspect-ratio:1;
object-fit:cover;
display:block;
}

.albumCardInfo{
padding:12px;
}

.albumCardName{
font-size:14px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.albumCardCount{
font-size:12px;
opacity:.5;
margin-top:3px;
}

.albumCardDel{
position:absolute;
top:8px; right:8px;
background:rgba(0,0,0,.7);
border:none;
border-radius:50%;
width:28px; height:28px;
color:white;
cursor:pointer;
font-size:14px;
display:none;
align-items:center;
justify-content:center;
}

.adminMode .albumCardDel{ display:flex; }

.addAlbumCard{
border-radius:16px;
border:2px dashed rgba(255,255,255,.2);
aspect-ratio:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.3s;
font-size:13px;
opacity:.5;
gap:10px;
height:fit-content;
}

.addAlbumCard:hover{ opacity:1; border-color:#7c5cff; }
.addAlbumCard span{ font-size:32px; }

/* FOTOCARDS GRID — CORRIGIDO */
.cardsGrid{
display:grid;
grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
gap:16px;
padding:16px 30px 40px;
width:100%;
}

.photoCard{
border-radius:12px;
overflow:hidden;
cursor:pointer;
transition:.3s;
position:relative;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);
}

.photoCard:hover{ transform:scale(1.03); }

.photoCard img{
width:100%;
height:240px;
object-fit:cover;
display:block;
}

.photoCardOverlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.6);
opacity:0;
transition:.3s;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
}

.photoCard:hover .photoCardOverlay{ opacity:1; }

.overlayBtn{
width:36px; height:36px;
border-radius:50%;
border:none;
cursor:pointer;
font-size:16px;
display:flex; align-items:center; justify-content:center;
transition:.2s;
}

.overlayBtnView{ background:#7c5cff; color:white; }
.overlayBtnFav{ background:rgba(255,80,80,.8); color:white; }
.overlayBtnFav.faved{ background:#ff4444; }

.photoCardDel{
position:absolute;
top:6px; right:6px;
background:rgba(0,0,0,.7);
border:none;
border-radius:50%;
width:26px; height:26px;
color:white;
cursor:pointer;
font-size:12px;
display:none;
align-items:center;
justify-content:center;
z-index:10;
}

.adminMode .photoCardDel{ display:flex; }

.addPhotoCard{
border-radius:12px;
border:2px dashed rgba(255,255,255,.2);
height:240px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.3s;
font-size:12px;
opacity:.5;
gap:8px;
}

.addPhotoCard:hover{ opacity:1; border-color:#7c5cff; }
.addPhotoCard span{ font-size:28px; }

/* LIGHTBOX */
#lightbox{
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
z-index:9999;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
}

#lightbox.open{ display:flex; }

#lightboxImg{
max-height:80vh;
max-width:90vw;
border-radius:12px;
object-fit:contain;
}

.lightboxBtns{
display:flex;
gap:12px;
margin-top:20px;
}

.lightboxBtn{
padding:10px 22px;
border:none;
border-radius:20px;
cursor:pointer;
font-size:14px;
}

.lbClose{ background:rgba(255,255,255,.1); color:white; }
.lbDownload{ background:#7c5cff; color:white; }
.lbFav{ background:rgba(255,80,80,.2); color:#ff6b6b; border:1px solid rgba(255,80,80,.3); }
.lbFav.faved{ background:#ff4444; color:white; }

.lightboxNav{
position:absolute;
top:50%; transform:translateY(-50%);
font-size:40px;
cursor:pointer;
opacity:.5;
transition:.2s;
padding:10px;
user-select:none;
}
.lightboxNav:hover{ opacity:1; }
#lbPrev{ left:20px; }
#lbNext{ right:20px; }

/* MODAIS */
.modal{
position:fixed; inset:0;
background:rgba(0,0,0,.85);
display:none; z-index:999;
justify-content:center; align-items:center;
}

.modalBox{
background:#111;
border-radius:20px;
padding:30px;
width:440px;
max-height:90vh;
overflow-y:auto;
}

.modalBox h2{ margin-bottom:20px; }

.inputField{
width:100%; padding:12px;
border-radius:10px; border:none;
background:#1a1a1a; color:white;
font-size:15px; margin-bottom:12px;
}

.dropZone{
border:2px dashed rgba(255,255,255,.2);
border-radius:14px; padding:25px;
text-align:center; cursor:pointer;
transition:.3s; margin-bottom:14px;
}
.dropZone:hover{ border-color:white; }
.dropZone.over{ border-color:#7c5cff; background:rgba(124,92,255,.08); }
.dropZone p{ opacity:.5; font-size:13px; margin-top:6px; }

.previewImg{
width:70px; height:70px;
border-radius:8px; object-fit:cover;
margin-top:8px; display:none;
}

.progressBar{
width:100%; height:4px;
background:rgba(255,255,255,.1);
border-radius:99px; overflow:hidden;
margin-top:10px; display:none;
}
.progressFill{ height:100%; background:#7c5cff; width:0%; transition:.3s; }

.statusText{ font-size:13px; opacity:.6; margin-top:6px; }

.btnRow{ display:flex; gap:10px; margin-top:14px; }
.btnPrimary{
flex:1; padding:12px; border:none;
border-radius:10px; background:#7c5cff;
color:white; font-size:15px; cursor:pointer;
}
.btnSecondary{
flex:1; padding:12px; border:none;
border-radius:10px; background:#333;
color:white; font-size:15px; cursor:pointer;
}

/* MULTI UPLOAD LIST */
.uploadList{ max-height:200px; overflow-y:auto; margin-top:10px; }
.uploadItem{
display:flex; align-items:center; gap:10px;
padding:8px; background:rgba(255,255,255,.05);
border-radius:8px; margin-bottom:6px; font-size:13px;
}
.uploadItem img{ width:36px; height:36px; border-radius:6px; object-fit:cover; }

/* EMPTY */
.emptyState{
padding:60px 30px;
text-align:center;
opacity:.4;
}
.emptyState span{ font-size:48px; display:block; margin-bottom:12px; }

/* TAG MEMBER */
.memberTag{
display:inline-block;
padding:3px 10px;
border-radius:20px;
font-size:11px;
background:rgba(124,92,255,.3);
color:#b39dff;
margin-top:6px;
}

</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="navBack" href="home.html">←</a>
  <h1 id="navTitle">Fotocards</h1>
  <div class="navBtns">
    <button class="navBtn navBtnFav" onclick="showFavs()">♥ Favoritos</button>
    <button class="navBtn navBtnSecondary" id="adminToggleBtn" onclick="toggleAdmin()">Admin</button>
  </div>
</nav>

<!-- VIEW: ÁLBUNS -->
<div id="viewAlbums" class="active">
  <div class="sectionHeader">
    <h2>Álbuns & Eras</h2>
  </div>
  <div class="albumGrid" id="albumGrid"></div>
</div>

<!-- VIEW: FOTOCARDS DO ÁLBUM -->
<div id="viewCards">
  <div class="sectionHeader">
    <div>
      <button style="background:none;border:none;color:white;font-size:18px;cursor:pointer;opacity:.7;margin-right:10px;" onclick="showAlbums()">←</button>
      <span id="albumTitle" style="font-size:22px;"></span>
    </div>
    <span id="cardCount" style="opacity:.5;font-size:14px;"></span>
  </div>
  <div class="cardsGrid" id="cardsGrid"></div>
</div>

<!-- VIEW: FAVORITOS -->
<div id="viewFavs">
  <div class="sectionHeader">
    <div>
      <button style="background:none;border:none;color:white;font-size:18px;cursor:pointer;opacity:.7;margin-right:10px;" onclick="showAlbums()">←</button>
      <span style="font-size:22px;">♥ Favoritos</span>
    </div>
    <span id="favCount" style="opacity:.5;font-size:14px;"></span>
  </div>
  <div class="cardsGrid" id="favsGrid"></div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <div class="lightboxNav" id="lbPrev" onclick="lbNavigate(-1)">‹</div>
  <img id="lightboxImg" src="">
  <div class="lightboxBtns">
    <button class="lightboxBtn lbFav" id="lbFavBtn" onclick="toggleFavLightbox()">♥ Favoritar</button>
    <button class="lightboxBtn lbDownload" onclick="downloadCurrent()">⬇ Baixar</button>
    <button class="lightboxBtn lbClose" onclick="closeLightbox()">✕ Fechar</button>
  </div>
  <div class="lightboxNav" id="lbNext" onclick="lbNavigate(1)">›</div>
</div>

<!-- MODAL: NOVO ÁLBUM -->
<div class="modal" id="modalAlbum">
  <div class="modalBox">
    <h2>➕ Novo Álbum</h2>
    <input class="inputField" id="albumName" placeholder="Nome do álbum (ex: BE, Map of the Soul)">
    <input class="inputField" id="albumArtist" placeholder="Artista (ex: BTS, Jimin, V)">
    <label style="font-size:13px;opacity:.6;">Capa do álbum</label>
    <div class="dropZone" id="albumCoverZone" onclick="document.getElementById('albumCoverInput').click()">
      🖼️ Arraste ou clique para selecionar
      <p id="albumCoverName">Nenhum arquivo</p>
      <img class="previewImg" id="albumCoverPreview">
    </div>
    <input type="file" id="albumCoverInput" accept="image/*" style="display:none">
    <div class="progressBar" id="albumProgress"><div class="progressFill" id="albumFill"></div></div>
    <p class="statusText" id="albumStatus"></p>
    <div class="btnRow">
      <button class="btnPrimary" onclick="submitAlbum()">CRIAR</button>
      <button class="btnSecondary" onclick="closeModal('modalAlbum')">CANCELAR</button>
    </div>
  </div>
</div>

<!-- MODAL: UPLOAD FOTOCARDS -->
<div class="modal" id="modalCards">
  <div class="modalBox">
    <h2>➕ Adicionar Fotocards</h2>
    <div class="dropZone" id="cardsDropZone" onclick="document.getElementById('cardsInput').click()">
      🖼️ Arraste várias fotos ou clique para selecionar
      <p>Você pode selecionar múltiplas imagens de uma vez</p>
    </div>
    <input type="file" id="cardsInput" accept="image/*" multiple style="display:none">
    <div class="uploadList" id="uploadList"></div>
    <div class="progressBar" id="cardsProgress"><div class="progressFill" id="cardsFill"></div></div>
    <p class="statusText" id="cardsStatus"></p>
    <div class="btnRow">
      <button class="btnPrimary" onclick="submitCards()">ENVIAR TUDO</button>
      <button class="btnSecondary" onclick="closeModal('modalCards')">CANCELAR</button>
    </div>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js"
import { getDatabase, ref, onValue, push, remove, get } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js"

const firebaseConfig = {
  apiKey: "AIzaSyDFShfAw6VJ51hjka27gUebd9fna6o4yGw",
  authDomain: "bts-archive-63f8b.firebaseapp.com",
  databaseURL: "https://bts-archive-63f8b-default-rtdb.firebaseio.com",
  projectId: "bts-archive-63f8b",
  storageBucket: "bts-archive-63f8b.firebasestorage.app",
  messagingSenderId: "995910359395",
  appId: "1:995910359395:web:faa0858e7a44cf101f9b56"
}

const app = initializeApp(firebaseConfig)
const db = getDatabase(app)

const CLOUDINARY_CLOUD = "dlcg5zzes"
const CLOUDINARY_PRESET = "bts_upload"

let albums = []
let currentAlbumId = null
let currentCards = []
let lightboxIndex = 0
let lightboxCards = []
let pendingFiles = []
let albumCoverFile = null
let isAdmin = false
let favorites = JSON.parse(localStorage.getItem("fcFavorites")) || []

// FIREBASE LISTENERS
onValue(ref(db, "fcAlbums"), snap => {
  albums = []
  snap.forEach(c => albums.push({ id:c.key, ...c.val() }))
  if(document.getElementById("viewAlbums").classList.contains("active")) renderAlbums()
})

// VIEWS
window.showAlbums = () => {
  setView("viewAlbums")
  document.getElementById("navTitle").innerText = "Fotocards"
  renderAlbums()
}

window.showFavs = () => {
  setView("viewFavs")
  document.getElementById("navTitle").innerText = "♥ Favoritos"
  renderFavs()
}

function showCards(albumId){
  currentAlbumId = albumId
  const album = albums.find(a => a.id === albumId)
  document.getElementById("albumTitle").innerText = album?.name || ""
  document.getElementById("navTitle").innerText = album?.name || ""
  setView("viewCards")

  onValue(ref(db, `fcCards/${albumId}`), snap => {
    currentCards = []
    snap.forEach(c => currentCards.push({ id:c.key, ...c.val() }))
    renderCards()
  })
}

function setView(id){
  ["viewAlbums","viewCards","viewFavs"].forEach(v => {
    document.getElementById(v).classList.remove("active")
  })
  document.getElementById(id).classList.add("active")
}

// RENDER ÁLBUNS
function renderAlbums(){
  const grid = document.getElementById("albumGrid")
  const body = document.body

  if(isAdmin) body.classList.add("adminMode")
  else body.classList.remove("adminMode")

  if(albums.length === 0 && !isAdmin){
    grid.innerHTML = `<div class="emptyState" style="grid-column:1/-1"><span>🎴</span>Nenhum álbum ainda</div>`
    return
  }

  grid.innerHTML = albums.map(a => `
    <div class="albumCard" onclick="handleAlbumClick(event,'${a.id}')">
      <img src="${a.cover}" onerror="this.src='https://via.placeholder.com/180'">
      <div class="albumCardInfo">
        <div class="albumCardName">${a.name}</div>
        <div class="albumCardCount">${a.artist || "BTS"}</div>
      </div>
      <button class="albumCardDel" onclick="deleteAlbum(event,'${a.id}')">✕</button>
    </div>
  `).join("") + (isAdmin ? `
    <div class="addAlbumCard" onclick="openModal('modalAlbum')">
      <span>+</span>Novo Álbum
    </div>
  ` : "")
}

window.handleAlbumClick = (e, id) => {
  if(e.target.classList.contains("albumCardDel")) return
  showCards(id)
}

window.deleteAlbum = async (e, id) => {
  e.stopPropagation()
  if(!confirm("Apagar este álbum e todos os fotocards?")) return
  await remove(ref(db, `fcAlbums/${id}`))
  await remove(ref(db, `fcCards/${id}`))
}

// RENDER FOTOCARDS
function renderCards(){
  const grid = document.getElementById("cardsGrid")
  document.getElementById("cardCount").innerText = `${currentCards.length} fotocards`
  lightboxCards = [...currentCards]

  if(currentCards.length === 0 && !isAdmin){
    grid.innerHTML = `<div class="emptyState" style="grid-column:1/-1"><span>🖼️</span>Nenhum fotocard ainda</div>`
    return
  }

  grid.innerHTML = currentCards.map((c,i) => `
    <div class="photoCard">
      <img src="${c.url}" loading="lazy" onerror="this.src='https://via.placeholder.com/160x240'">
      <div class="photoCardOverlay">
        <button class="overlayBtn overlayBtnView" onclick="openLightbox(${i})">👁</button>
        <button class="overlayBtn overlayBtnFav ${favorites.includes(c.url)?'faved':''}" onclick="toggleFav('${c.url}',this)">♥</button>
      </div>
      <button class="photoCardDel" onclick="deleteCard('${c.id}')">✕</button>
    </div>
  `).join("") + (isAdmin ? `
    <div class="addPhotoCard" onclick="openModal('modalCards')">
      <span>+</span>Adicionar fotos
    </div>
  ` : "")
}

// RENDER FAVORITOS
function renderFavs(){
  const grid = document.getElementById("favsGrid")
  document.getElementById("favCount").innerText = `${favorites.length} fotocards`

  if(favorites.length === 0){
    grid.innerHTML = `<div class="emptyState" style="grid-column:1/-1"><span>♥</span>Nenhum favorito ainda</div>`
    return
  }

  grid.innerHTML = favorites.map((url,i) => `
    <div class="photoCard">
      <img src="${url}" loading="lazy">
      <div class="photoCardOverlay">
        <button class="overlayBtn overlayBtnView" onclick="openLightboxFav(${i})">👁</button>
        <button class="overlayBtn overlayBtnFav faved" onclick="removeFav('${url}',this)">♥</button>
      </div>
    </div>
  `).join("")
}

// FAVORITOS
window.toggleFav = (url, btn) => {
  const idx = favorites.indexOf(url)
  if(idx === -1){ favorites.push(url); btn.classList.add("faved") }
  else { favorites.splice(idx,1); btn.classList.remove("faved") }
  localStorage.setItem("fcFavorites", JSON.stringify(favorites))
}

window.removeFav = (url, btn) => {
  favorites = favorites.filter(f => f !== url)
  localStorage.setItem("fcFavorites", JSON.stringify(favorites))
  renderFavs()
}

// LIGHTBOX
window.openLightbox = (i) => {
  lightboxIndex = i
  lightboxCards = [...currentCards]
  showLightboxItem()
  document.getElementById("lightbox").classList.add("open")
}

window.openLightboxFav = (i) => {
  lightboxCards = favorites.map(url => ({ url }))
  lightboxIndex = i
  showLightboxItem()
  document.getElementById("lightbox").classList.add("open")
}

function showLightboxItem(){
  const card = lightboxCards[lightboxIndex]
  document.getElementById("lightboxImg").src = card.url
  const favBtn = document.getElementById("lbFavBtn")
  favBtn.classList.toggle("faved", favorites.includes(card.url))
  favBtn.innerText = favorites.includes(card.url) ? "♥ Favoritado" : "♥ Favoritar"
}

window.lbNavigate = (dir) => {
  lightboxIndex = (lightboxIndex + dir + lightboxCards.length) % lightboxCards.length
  showLightboxItem()
}

window.closeLightbox = () => {
  document.getElementById("lightbox").classList.remove("open")
}

window.toggleFavLightbox = () => {
  const url = lightboxCards[lightboxIndex].url
  const idx = favorites.indexOf(url)
  if(idx === -1) favorites.push(url)
  else favorites.splice(idx,1)
  localStorage.setItem("fcFavorites", JSON.stringify(favorites))
  showLightboxItem()
}

window.downloadCurrent = () => {
  const url = lightboxCards[lightboxIndex].url
  const a = document.createElement("a")
  a.href = url
  a.download = "fotocard.jpg"
  a.target = "_blank"
  a.click()
}

// Fechar lightbox com Esc / setas
document.addEventListener("keydown", e => {
  if(!document.getElementById("lightbox").classList.contains("open")) return
  if(e.key === "Escape") closeLightbox()
  if(e.key === "ArrowRight") lbNavigate(1)
  if(e.key === "ArrowLeft") lbNavigate(-1)
})

// CLOUDINARY
async function uploadToCloudinary(file, onProgress){
  return new Promise((resolve, reject) => {
    const fd = new FormData()
    fd.append("file", file)
    fd.append("upload_preset", CLOUDINARY_PRESET)
    const xhr = new XMLHttpRequest()
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`)
    xhr.upload.onprogress = e => { if(e.lengthComputable) onProgress(Math.round(e.loaded/e.total*100)) }
    xhr.onload = () => {
      const res = JSON.parse(xhr.responseText)
      res.secure_url ? resolve(res.secure_url) : reject(res)
    }
    xhr.onerror = reject
    xhr.send(fd)
  })
}

// DROP ZONES
function setupDrop(zoneId, inputId, onFiles){
  const zone = document.getElementById(zoneId)
  const input = document.getElementById(inputId)
  zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("over") })
  zone.addEventListener("dragleave", () => zone.classList.remove("over"))
  zone.addEventListener("drop", e => { e.preventDefault(); zone.classList.remove("over"); onFiles(Array.from(e.dataTransfer.files)) })
  input.addEventListener("change", () => onFiles(Array.from(input.files)))
}

setupDrop("albumCoverZone", "albumCoverInput", files => {
  albumCoverFile = files[0]
  document.getElementById("albumCoverName").innerText = files[0].name
  const prev = document.getElementById("albumCoverPreview")
  prev.src = URL.createObjectURL(files[0])
  prev.style.display = "block"
})

setupDrop("cardsDropZone", "cardsInput", files => {
  const novos = files.filter(f => f.type.startsWith("image/"))
  pendingFiles = [...pendingFiles, ...novos]
  const list = document.getElementById("uploadList")
  list.innerHTML = pendingFiles.map(f => `
    <div class="uploadItem">
      <img src="${URL.createObjectURL(f)}">
      <span>${f.name}</span>
    </div>
  `).join("")
  document.getElementById("cardsInput").value = ""
})

// SUBMIT ÁLBUM
window.submitAlbum = async () => {
  const name = document.getElementById("albumName").value.trim()
  const artist = document.getElementById("albumArtist").value.trim()
  if(!name || !albumCoverFile){ alert("Preencha o nome e a capa!"); return }

  const fill = document.getElementById("albumFill")
  const status = document.getElementById("albumStatus")
  document.getElementById("albumProgress").style.display = "block"
  status.innerText = "Enviando capa..."

  try {
    const coverUrl = await uploadToCloudinary(albumCoverFile, p => fill.style.width = p + "%")
    await push(ref(db, "fcAlbums"), { name, artist: artist||"BTS", cover: coverUrl })
    status.innerText = "✅ Álbum criado!"
    setTimeout(() => { closeModal("modalAlbum"); albumCoverFile = null }, 1000)
  } catch(e) {
    status.innerText = "❌ Erro. Tente novamente."
  }
}

// SUBMIT FOTOCARDS
window.submitCards = async () => {
  if(!pendingFiles.length){ alert("Selecione pelo menos uma imagem!"); return }
  if(!currentAlbumId){ alert("Erro: nenhum álbum selecionado."); return }

  const fill = document.getElementById("cardsFill")
  const status = document.getElementById("cardsStatus")
  document.getElementById("cardsProgress").style.display = "block"

  try {
    for(let i = 0; i < pendingFiles.length; i++){
      status.innerText = `Enviando ${i+1} de ${pendingFiles.length}...`
      const url = await uploadToCloudinary(pendingFiles[i], p => {
        fill.style.width = ((i + p/100) / pendingFiles.length * 100) + "%"
      })
      await push(ref(db, `fcCards/${currentAlbumId}`), { url })
    }
    fill.style.width = "100%"
    status.innerText = `✅ ${pendingFiles.length} fotocards adicionados!`
    pendingFiles = []
    setTimeout(() => {
      closeModal("modalCards")
      showCards(currentAlbumId)
    }, 1000)
  } catch(e) {
    status.innerText = "❌ Erro no upload."
    console.error(e)
  }
}

// DELETE CARD
window.deleteCard = async (id) => {
  if(!confirm("Apagar este fotocard?")) return
  await remove(ref(db, `fcCards/${currentAlbumId}/${id}`))
  showCards(currentAlbumId)
}

// ADMIN
window.toggleAdmin = () => {
  if(!isAdmin){
    const key = prompt("Admin key:")
    if(key !== "12345"){ alert("Acesso negado"); return }
    isAdmin = true
    document.getElementById("adminToggleBtn").innerText = "✓ Admin"
    document.getElementById("adminToggleBtn").style.background = "rgba(124,92,255,.3)"
    document.body.classList.add("adminMode")
  } else {
    isAdmin = false
    document.getElementById("adminToggleBtn").innerText = "Admin"
    document.getElementById("adminToggleBtn").style.background = ""
    document.body.classList.remove("adminMode")
  }
  renderAlbums()
}

// MODAL HELPERS
window.openModal = (id) => { document.getElementById(id).style.display = "flex" }
window.closeModal = (id) => {
  document.getElementById(id).style.display = "none"
  document.getElementById("albumProgress").style.display = "none"
  document.getElementById("albumStatus").innerText = ""
  document.getElementById("cardsProgress").style.display = "none"
  document.getElementById("cardsFill").style.width = "0%"
  document.getElementById("cardsStatus").innerText = ""
  document.getElementById("uploadList").innerHTML = ""
  document.getElementById("cardsInput").value = ""
  pendingFiles = []
}

// INIT
renderAlbums()

</script>
</body>
</html>
