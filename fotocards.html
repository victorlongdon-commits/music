<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FOTOCARDS</title>
<style>

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  font-family:Arial;
  background:#08080f;
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

/* NAV */
nav{
  height:70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 24px;
  border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky;
  top:0;
  background:#08080f;
  z-index:100;
}

.nav-left{ display:flex; align-items:center; gap:20px; }
.back-btn{
  cursor:pointer;
  opacity:.6;
  font-size:22px;
  transition:.2s;
}
.back-btn:hover{ opacity:1; }
.nav-title{ font-size:13px; letter-spacing:5px; opacity:.5; }
.nav-right{ display:flex; gap:10px; align-items:center; }

.btn{
  padding:9px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
  transition:.2s;
}
.btn:hover{ transform:scale(1.04); }
.btn-primary{ background:#7c5cff; color:white; }
.btn-secondary{ background:rgba(255,255,255,.08); color:white; }
.btn-danger{ background:rgba(255,60,60,.15); color:#ff6b6b; }

/* BREADCRUMB */
.breadcrumb{
  padding:16px 24px;
  font-size:13px;
  opacity:.4;
  letter-spacing:1px;
}
.breadcrumb span{ cursor:pointer; }
.breadcrumb span:hover{ opacity:.8; color:white; }
.breadcrumb .sep{ margin:0 8px; }

/* ALBUMS GRID */
.section{ padding:0 24px 40px; }
.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
}
.section-title{ font-size:11px; letter-spacing:4px; opacity:.4; }

.albums-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
  gap:20px;
}

.album-card{
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  position:relative;
  aspect-ratio:1;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  transition:.35s;
}
.album-card:hover{
  transform:scale(1.04) translateY(-4px);
  border-color:rgba(255,255,255,.18);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.album-card img{
  width:100%; height:100%;
  object-fit:cover;
  transition:.4s;
}
.album-card:hover img{ transform:scale(1.06); }

.album-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.85) 0%, transparent 55%);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:16px;
}
.album-name{ font-size:15px; font-weight:bold; }
.album-count{ font-size:12px; opacity:.5; margin-top:3px; }

.album-placeholder{
  width:100%; height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  background:linear-gradient(135deg, rgba(124,92,255,.15), rgba(80,60,180,.1));
}

/* FOTOCARDS GRID */
.cards-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
  gap:16px;
}

.fotocard{
  border-radius:14px;
  overflow:hidden;
  aspect-ratio:2/3;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  transition:.3s;
  cursor:pointer;
  position:relative;
}
.fotocard:hover{
  transform:scale(1.05) translateY(-4px);
  border-color:rgba(255,255,255,.2);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
}
.fotocard img{
  width:100%; height:100%;
  object-fit:cover;
}
.fotocard-label{
  position:absolute;
  bottom:0; left:0; right:0;
  background:linear-gradient(to top, rgba(0,0,0,.8), transparent);
  padding:20px 10px 10px;
  font-size:12px;
  opacity:0;
  transition:.3s;
}
.fotocard:hover .fotocard-label{ opacity:1; }

/* ADMIN BADGE */
.admin-badge{
  position:absolute;
  top:8px; right:8px;
  background:rgba(255,60,60,.2);
  border:1px solid rgba(255,60,60,.4);
  border-radius:6px;
  padding:3px 8px;
  font-size:10px;
  color:#ff6b6b;
  cursor:pointer;
  opacity:0;
  transition:.2s;
}
.album-card:hover .admin-badge,
.fotocard:hover .admin-badge{ opacity:1; }

/* EMPTY STATE */
.empty{
  text-align:center;
  padding:80px 20px;
  opacity:.3;
}
.empty-icon{ font-size:60px; margin-bottom:16px; }
.empty-text{ font-size:16px; }

/* LIGHTBOX */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.93);
  z-index:999;
  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.lightbox.open{ display:flex; }
.lightbox-img{
  max-height:90vh;
  max-width:90vw;
  border-radius:14px;
  object-fit:contain;
  box-shadow:0 40px 100px rgba(0,0,0,.8);
}
.lightbox-close{
  position:absolute;
  top:20px; right:24px;
  font-size:28px;
  cursor:pointer;
  opacity:.5;
  transition:.2s;
}
.lightbox-close:hover{ opacity:1; }
.lightbox-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  cursor:pointer;
  opacity:.4;
  transition:.2s;
  user-select:none;
}
.lightbox-nav:hover{ opacity:1; }
.lightbox-prev{ left:20px; }
.lightbox-next{ right:20px; }
.lightbox-info{
  position:absolute;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  font-size:13px;
  opacity:.4;
  letter-spacing:2px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  z-index:9999;
  justify-content:center;
  align-items:center;
}
.modal.open{ display:flex; }
.modal-box{
  background:#111118;
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:32px;
  width:460px;
  max-height:90vh;
  overflow-y:auto;
}
.modal-box h2{ margin-bottom:22px; font-size:18px; }

.input-field{
  width:100%;
  padding:13px 16px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.05);
  color:white;
  font-size:14px;
  margin-bottom:14px;
  outline:none;
  transition:.2s;
}
.input-field:focus{ border-color:rgba(124,92,255,.5); }

.drop-zone{
  border:2px dashed rgba(255,255,255,.15);
  border-radius:14px;
  padding:28px;
  text-align:center;
  cursor:pointer;
  transition:.3s;
  margin-bottom:14px;
}
.drop-zone:hover{ border-color:rgba(124,92,255,.5); background:rgba(124,92,255,.05); }
.drop-zone.over{ border-color:#7c5cff; background:rgba(124,92,255,.1); }
.drop-zone p{ font-size:13px; opacity:.4; margin-top:6px; }

.preview-img{
  width:80px; height:80px;
  border-radius:10px;
  object-fit:cover;
  margin-top:10px;
  display:none;
}

.btn-row{ display:flex; gap:10px; margin-top:14px; }
.btn-row .btn{ flex:1; padding:13px; font-size:14px; }

.progress-bar{
  width:100%;
  height:4px;
  background:rgba(255,255,255,.08);
  border-radius:99px;
  overflow:hidden;
  margin-top:10px;
  display:none;
}
.progress-fill{
  height:100%;
  background:#7c5cff;
  width:0%;
  transition:.3s;
}
.status-text{ font-size:12px; opacity:.5; margin-top:6px; }

/* SELECT ALBUM dropdown */
.album-select{
  width:100%;
  padding:13px 16px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.05);
  color:white;
  font-size:14px;
  margin-bottom:14px;
  outline:none;
  appearance:none;
  cursor:pointer;
}
.album-select option{ background:#111118; }

/* LOADING */
#loadingScreen{
  position:fixed;
  inset:0;
  background:#08080f;
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:18px;
  letter-spacing:6px;
  transition:1s;
}

</style>
</head>
<body>

<div id="loadingScreen">LOADING</div>

<!-- NAV -->
<nav>
  <div class="nav-left">
    <span class="back-btn" onclick="goBack()">←</span>
    <span class="nav-title">FOTOCARDS</span>
  </div>
  <div class="nav-right" id="adminBtns" style="display:none;">
    <button class="btn btn-primary" onclick="openAddAlbum()">+ ÁLBUM</button>
    <button class="btn btn-primary" onclick="openAddCard()">+ FOTOCARD</button>
  </div>
</nav>

<!-- BREADCRUMB -->
<div class="breadcrumb" id="breadcrumb">
  <span onclick="showAlbums()">Álbuns</span>
</div>

<!-- CONTENT -->
<div class="section">
  <div class="section-header">
    <span class="section-title" id="sectionTitle">TODOS OS ÁLBUNS</span>
  </div>
  <div id="mainContent"></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <span class="lightbox-close" onclick="closeLightbox()">✕</span>
  <span class="lightbox-nav lightbox-prev" onclick="lbPrev(event)">‹</span>
  <img class="lightbox-img" id="lbImg">
  <span class="lightbox-nav lightbox-next" onclick="lbNext(event)">›</span>
  <span class="lightbox-info" id="lbInfo"></span>
</div>

<!-- MODAL: ADD ÁLBUM -->
<div class="modal" id="modalAlbum">
  <div class="modal-box">
    <h2>➕ Novo Álbum</h2>
    <input class="input-field" id="albumName" placeholder="Nome do álbum (ex: Butter)">
    <input class="input-field" id="albumYear" placeholder="Ano (ex: 2021)">
    <label style="font-size:13px;opacity:.5;margin-bottom:8px;display:block;">Capa do álbum</label>
    <div class="drop-zone" id="albumCoverZone" onclick="document.getElementById('albumCoverInput').click()">
      🖼️ Clique ou arraste a capa
      <p id="albumCoverName">Nenhum arquivo</p>
      <img class="preview-img" id="albumCoverPreview">
    </div>
    <input type="file" id="albumCoverInput" accept="image/*" style="display:none">
    <div class="progress-bar" id="albumProgress"><div class="progress-fill" id="albumFill"></div></div>
    <p class="status-text" id="albumStatus"></p>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="submitAlbum()">SALVAR</button>
      <button class="btn btn-secondary" onclick="closeModal('modalAlbum')">CANCELAR</button>
    </div>
  </div>
</div>

<!-- MODAL: ADD FOTOCARD -->
<div class="modal" id="modalCard">
  <div class="modal-box">
    <h2>🃏 Novo Fotocard</h2>
    <label style="font-size:13px;opacity:.5;margin-bottom:8px;display:block;">Álbum</label>
    <select class="album-select" id="cardAlbumSelect"></select>
    <input class="input-field" id="cardName" placeholder="Nome/descrição (ex: Jungkook ver. A)">
    <label style="font-size:13px;opacity:.5;margin-bottom:8px;display:block;">Imagem do fotocard</label>
    <div class="drop-zone" id="cardImgZone" onclick="document.getElementById('cardImgInput').click()">
      🖼️ Clique ou arraste a imagem
      <p id="cardImgName">Nenhum arquivo</p>
      <img class="preview-img" id="cardImgPreview">
    </div>
    <input type="file" id="cardImgInput" accept="image/*" style="display:none">
    <div class="progress-bar" id="cardProgress"><div class="progress-fill" id="cardFill"></div></div>
    <p class="status-text" id="cardStatus"></p>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="submitCard()">SALVAR</button>
      <button class="btn btn-secondary" onclick="closeModal('modalCard')">CANCELAR</button>
    </div>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js"
import { getDatabase, ref, onValue, push, remove, get } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js"

const firebaseConfig = {
  apiKey: "AIzaSyDFShfAw6VJ51hjka27gUebd9fna6o4yGw",
  authDomain: "bts-archive-63f8b.firebaseapp.com",
  databaseURL: "https://bts-archive-63f8b-default-rtdb.firebaseio.com",
  projectId: "bts-archive-63f8b",
  storageBucket: "bts-archive-63f8b.firebasestorage.app",
  messagingSenderId: "995910359395",
  appId: "1:995910359395:web:faa0858e7a44cf101f9b56"
}

const app = initializeApp(firebaseConfig)
const db = getDatabase(app)
const albumsRef = ref(db, "albums")
const cardsRef = ref(db, "fotocards")

const CLOUDINARY_CLOUD = "dlcg5zzes"
const CLOUDINARY_PRESET = "bts_upload"

let albums = []
let fotocards = []
let currentAlbum = null
let isAdmin = false
let albumCoverFile = null
let cardImgFile = null
let lbCards = []
let lbIndex = 0

// Verifica admin salvo
if(localStorage.getItem("isAdmin") === "true"){
  isAdmin = true
  document.getElementById("adminBtns").style.display = "flex"
}

// Carrega dados
onValue(albumsRef, snap => {
  albums = []
  snap.forEach(child => albums.push({ id: child.key, ...child.val() }))
  if(currentAlbum) renderCards(currentAlbum)
  else renderAlbums()
})

onValue(cardsRef, snap => {
  fotocards = []
  snap.forEach(child => fotocards.push({ id: child.key, ...child.val() }))
  document.getElementById("loadingScreen").style.opacity = "0"
  setTimeout(()=>{ document.getElementById("loadingScreen").style.display = "none" }, 1000)
  if(currentAlbum) renderCards(currentAlbum)
  else renderAlbums()
})

// RENDERIZAR ÁLBUNS
window.renderAlbums = function(){
  currentAlbum = null
  document.getElementById("sectionTitle").innerText = "TODOS OS ÁLBUNS"
  document.getElementById("breadcrumb").innerHTML = `<span onclick="showAlbums()">Álbuns</span>`

  const grid = document.getElementById("mainContent")
  if(albums.length === 0){
    grid.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📁</div>
        <div class="empty-text">Nenhum álbum ainda</div>
      </div>`
    return
  }

  grid.innerHTML = `<div class="albums-grid">${albums.map(a => {
    const count = fotocards.filter(c => c.albumId === a.id).length
    const coverHtml = a.cover
      ? `<img src="${a.cover}" onerror="this.style.display='none'">`
      : `<div class="album-placeholder">📀</div>`
    const adminHtml = isAdmin
      ? `<div class="admin-badge" onclick="removeAlbum(event,'${a.id}')">✕</div>`
      : ""
    return `
      <div class="album-card" onclick="openAlbum('${a.id}')">
        ${coverHtml}
        ${adminHtml}
        <div class="album-overlay">
          <div class="album-name">${a.name}</div>
          <div class="album-count">${a.year || ""} · ${count} card${count !== 1 ? "s" : ""}</div>
        </div>
      </div>`
  }).join("")}</div>`
}

// ABRIR ÁLBUM
window.openAlbum = function(albumId){
  currentAlbum = albumId
  renderCards(albumId)
}

window.renderCards = function(albumId){
  const album = albums.find(a => a.id === albumId)
  if(!album) return

  document.getElementById("sectionTitle").innerText = album.name.toUpperCase()
  document.getElementById("breadcrumb").innerHTML = `
    <span onclick="showAlbums()">Álbuns</span>
    <span class="sep">›</span>
    <span>${album.name}</span>`

  const cards = fotocards.filter(c => c.albumId === albumId)
  lbCards = cards

  const grid = document.getElementById("mainContent")
  if(cards.length === 0){
    grid.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🃏</div>
        <div class="empty-text">Nenhum fotocard neste álbum ainda</div>
      </div>`
    return
  }

  grid.innerHTML = `<div class="cards-grid">${cards.map((c, i) => {
    const adminHtml = isAdmin
      ? `<div class="admin-badge" onclick="removeCard(event,'${c.id}')">✕</div>`
      : ""
    return `
      <div class="fotocard" onclick="openLightbox(${i})">
        <img src="${c.img}" onerror="this.src='https://via.placeholder.com/160x240'">
        ${adminHtml}
        <div class="fotocard-label">${c.name || ""}</div>
      </div>`
  }).join("")}</div>`
}

window.showAlbums = renderAlbums

// BACK
window.goBack = function(){
  if(currentAlbum){ renderAlbums() }
  else { window.location.href = "home.html" }
}

// LIGHTBOX
window.openLightbox = function(i){
  lbIndex = i
  updateLb()
  document.getElementById("lightbox").classList.add("open")
}
window.closeLightbox = function(e){
  if(!e || e.target === document.getElementById("lightbox") || e.target.classList.contains("lightbox-close")){
    document.getElementById("lightbox").classList.remove("open")
  }
}
window.lbPrev = function(e){ e.stopPropagation(); lbIndex = (lbIndex - 1 + lbCards.length) % lbCards.length; updateLb() }
window.lbNext = function(e){ e.stopPropagation(); lbIndex = (lbIndex + 1) % lbCards.length; updateLb() }
function updateLb(){
  const c = lbCards[lbIndex]
  document.getElementById("lbImg").src = c.img
  document.getElementById("lbInfo").innerText = `${c.name || ""} · ${lbIndex + 1} / ${lbCards.length}`
}

document.addEventListener("keydown", e => {
  const lb = document.getElementById("lightbox")
  if(!lb.classList.contains("open")) return
  if(e.key === "ArrowLeft") { lbIndex = (lbIndex - 1 + lbCards.length) % lbCards.length; updateLb() }
  if(e.key === "ArrowRight") { lbIndex = (lbIndex + 1) % lbCards.length; updateLb() }
  if(e.key === "Escape") lb.classList.remove("open")
})

// CLOUDINARY
async function uploadToCloudinary(file, onProgress){
  return new Promise((resolve, reject) => {
    const formData = new FormData()
    formData.append("file", file)
    formData.append("upload_preset", CLOUDINARY_PRESET)
    const xhr = new XMLHttpRequest()
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`)
    xhr.upload.onprogress = e => { if(e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100)) }
    xhr.onload = () => {
      const res = JSON.parse(xhr.responseText)
      if(res.secure_url) resolve(res.secure_url)
      else reject(res)
    }
    xhr.onerror = reject
    xhr.send(formData)
  })
}

// DROP ZONES
function setupDrop(zoneId, inputId, previewId, nameId, onFile){
  const zone = document.getElementById(zoneId)
  const input = document.getElementById(inputId)
  zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("over") })
  zone.addEventListener("dragleave", () => zone.classList.remove("over"))
  zone.addEventListener("drop", e => {
    e.preventDefault(); zone.classList.remove("over")
    if(e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0])
  })
  input.addEventListener("change", () => { if(input.files[0]) onFile(input.files[0]) })
}

setupDrop("albumCoverZone", "albumCoverInput", "albumCoverPreview", "albumCoverName", file => {
  albumCoverFile = file
  document.getElementById("albumCoverName").innerText = file.name
  const prev = document.getElementById("albumCoverPreview")
  prev.src = URL.createObjectURL(file); prev.style.display = "block"
})

setupDrop("cardImgZone", "cardImgInput", "cardImgPreview", "cardImgName", file => {
  cardImgFile = file
  document.getElementById("cardImgName").innerText = file.name
  const prev = document.getElementById("cardImgPreview")
  prev.src = URL.createObjectURL(file); prev.style.display = "block"
})

// ADD ÁLBUM
window.openAddAlbum = function(){
  albumCoverFile = null
  document.getElementById("albumName").value = ""
  document.getElementById("albumYear").value = ""
  document.getElementById("albumCoverName").innerText = "Nenhum arquivo"
  document.getElementById("albumCoverPreview").style.display = "none"
  document.getElementById("albumStatus").innerText = ""
  document.getElementById("albumProgress").style.display = "none"
  openModal("modalAlbum")
}

window.submitAlbum = async function(){
  const name = document.getElementById("albumName").value.trim()
  const year = document.getElementById("albumYear").value.trim()
  if(!name){ alert("Coloque o nome do álbum!"); return }

  const progress = document.getElementById("albumProgress")
  const fill = document.getElementById("albumFill")
  const status = document.getElementById("albumStatus")
  let coverUrl = ""

  try {
    if(albumCoverFile){
      progress.style.display = "block"
      status.innerText = "Enviando capa..."
      coverUrl = await uploadToCloudinary(albumCoverFile, p => fill.style.width = p + "%")
    }
    await push(albumsRef, { name, year, cover: coverUrl })
    status.innerText = "✅ Álbum criado!"
    fill.style.width = "100%"
    setTimeout(() => closeModal("modalAlbum"), 1200)
  } catch(err){
    status.innerText = "❌ Erro. Tente novamente."
    console.error(err)
  }
}

window.removeAlbum = function(e, id){
  e.stopPropagation()
  if(!confirm("Remover este álbum e todos os seus fotocards?")) return
  remove(ref(db, "albums/" + id))
  const toRemove = fotocards.filter(c => c.albumId === id)
  toRemove.forEach(c => remove(ref(db, "fotocards/" + c.id)))
}

// ADD FOTOCARD
window.openAddCard = function(){
  cardImgFile = null
  document.getElementById("cardName").value = ""
  document.getElementById("cardImgName").innerText = "Nenhum arquivo"
  document.getElementById("cardImgPreview").style.display = "none"
  document.getElementById("cardStatus").innerText = ""
  document.getElementById("cardProgress").style.display = "none"

  const sel = document.getElementById("cardAlbumSelect")
  sel.innerHTML = albums.map(a => `<option value="${a.id}">${a.name}</option>`).join("")
  if(currentAlbum) sel.value = currentAlbum

  openModal("modalCard")
}

window.submitCard = async function(){
  const albumId = document.getElementById("cardAlbumSelect").value
  const name = document.getElementById("cardName").value.trim()
  if(!albumId || !cardImgFile){ alert("Selecione o álbum e a imagem!"); return }

  const progress = document.getElementById("cardProgress")
  const fill = document.getElementById("cardFill")
  const status = document.getElementById("cardStatus")

  try {
    progress.style.display = "block"
    status.innerText = "Enviando imagem..."
    const imgUrl = await uploadToCloudinary(cardImgFile, p => fill.style.width = p + "%")
    await push(cardsRef, { albumId, name, img: imgUrl })
    status.innerText = "✅ Fotocard adicionado!"
    fill.style.width = "100%"
    setTimeout(() => closeModal("modalCard"), 1200)
  } catch(err){
    status.innerText = "❌ Erro. Tente novamente."
    console.error(err)
  }
}

window.removeCard = function(e, id){
  e.stopPropagation()
  if(!confirm("Remover este fotocard?")) return
  remove(ref(db, "fotocards/" + id))
}

// ADMIN CHECK — compartilha mesma senha do home.html
window.checkAdmin = function(){
  const key = prompt("Admin key:")
  if(key === "12345"){
    isAdmin = true
    localStorage.setItem("isAdmin", "true")
    document.getElementById("adminBtns").style.display = "flex"
    alert("Modo admin ativado!")
    if(currentAlbum) renderCards(currentAlbum)
    else renderAlbums()
  } else {
    alert("Acesso negado")
  }
}

// MODAIS
window.openModal = id => document.getElementById(id).classList.add("open")
window.closeModal = id => document.getElementById(id).classList.remove("open")

document.querySelectorAll(".modal").forEach(m => {
  m.addEventListener("click", e => { if(e.target === m) m.classList.remove("open") })
})

</script>
