<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FOTOCARDS</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }

body{
  font-family:Arial;
  background:#0a0a0a;
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

/* NAV */
nav{
  height:70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 24px;
  border-bottom:1px solid rgba(255,255,255,.1);
  position:sticky;
  top:0;
  background:#0a0a0a;
  z-index:100;
  gap:12px;
}

.navLeft{ display:flex; align-items:center; gap:20px; }
.navRight{ display:flex; align-items:center; gap:12px; }

.backBtn{
  background:none;
  border:none;
  color:white;
  font-size:22px;
  cursor:pointer;
  padding:6px;
  border-radius:8px;
  transition:.2s;
  display:none;
}
.backBtn:hover{ background:rgba(255,255,255,.1); }

.logo{
  font-size:18px;
  font-weight:bold;
  letter-spacing:4px;
  opacity:.9;
}

.breadcrumb{
  font-size:13px;
  opacity:.45;
  letter-spacing:1px;
}

#adminBadge{
  font-size:11px;
  background:#7c5cff;
  padding:4px 10px;
  border-radius:20px;
  display:none;
}

button.navBtn{
  padding:8px 16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
  background:#1a1a1a;
  color:white;
  transition:.2s;
}
button.navBtn:hover{ background:#2a2a2a; }

button.navBtnPurple{
  background:#7c5cff;
  color:white;
}
button.navBtnPurple:hover{ background:#6a4dee; }

#addAlbumBtn, #addCardBtn, #removeCardBtn{
  display:none;
}

/* VIEWS */
#albumView, #cardsView{ display:none; }
#albumView.active, #cardsView.active{ display:block; }

/* PAGE HEADER */
.pageHeader{
  padding:40px 32px 24px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:16px;
}

.pageTitle{
  font-size:36px;
  font-weight:bold;
  letter-spacing:2px;
}

.pageSubtitle{
  font-size:13px;
  opacity:.4;
  margin-top:6px;
  letter-spacing:1px;
}

/* ALBUMS GRID */
.albumsGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
  gap:24px;
  padding:0 32px 60px;
}

.albumCard{
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  transition:.3s;
  background:#111;
  position:relative;
  aspect-ratio:1/1.1;
}

.albumCard:hover{ transform:translateY(-6px); box-shadow:0 20px 50px rgba(124,92,255,.25); }

.albumCard img{
  width:100%;
  height:75%;
  object-fit:cover;
  display:block;
}

.albumCardPlaceholder{
  width:100%;
  height:75%;
  background:linear-gradient(135deg,#1a1a2e,#16213e);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
}

.albumInfo{
  padding:14px;
  height:25%;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.albumName{
  font-size:15px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.albumMeta{
  font-size:12px;
  opacity:.4;
  margin-top:3px;
}

.albumRemoveBtn{
  position:absolute;
  top:10px; right:10px;
  background:rgba(0,0,0,.7);
  border:none;
  color:white;
  width:28px; height:28px;
  border-radius:50%;
  font-size:14px;
  cursor:pointer;
  display:none;
  align-items:center;
  justify-content:center;
  transition:.2s;
}
.albumRemoveBtn:hover{ background:rgba(200,50,50,.8); }

/* CARDS VIEW HEADER */
.cardsHeader{
  padding:40px 32px 10px;
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.albumCover{
  width:100px; height:100px;
  border-radius:12px;
  object-fit:cover;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
  flex-shrink:0;
  display:none;
}

.albumCoverPlaceholder{
  width:100px; height:100px;
  border-radius:12px;
  background:linear-gradient(135deg,#1a1a2e,#16213e);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  flex-shrink:0;
}

.albumTitleBlock{}
.albumTitleBlock h1{ font-size:28px; letter-spacing:2px; }
.albumTitleBlock p{ font-size:13px; opacity:.4; margin-top:5px; }

/* FOTOCARDS GRID */
.cardsGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
  gap:16px;
  padding:24px 32px 60px;
}

.photoCard{
  border-radius:14px;
  overflow:hidden;
  background:#111;
  transition:.3s;
  position:relative;
  cursor:pointer;
}

.photoCard:hover{ transform:scale(1.03); box-shadow:0 12px 40px rgba(0,0,0,.5); }

.photoCard img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
}

.photoCardLabel{
  padding:10px;
  font-size:12px;
  opacity:.6;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.cardRemoveBtn{
  position:absolute;
  top:8px; right:8px;
  background:rgba(0,0,0,.75);
  border:none;
  color:white;
  width:26px; height:26px;
  border-radius:50%;
  font-size:13px;
  cursor:pointer;
  display:none;
  align-items:center;
  justify-content:center;
  transition:.2s;
}
.cardRemoveBtn:hover{ background:rgba(200,50,50,.8); }

/* EMPTY STATE */
.emptyState{
  text-align:center;
  padding:80px 20px;
  opacity:.3;
}
.emptyState .emptyIcon{ font-size:56px; margin-bottom:16px; }
.emptyState p{ font-size:15px; letter-spacing:1px; }

/* LIGHTBOX */
#lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.93);
  z-index:9999;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:16px;
}

#lightbox.open{ display:flex; }

#lightboxImg{
  max-width:90vw;
  max-height:80vh;
  border-radius:12px;
  object-fit:contain;
  box-shadow:0 0 80px rgba(0,0,0,.8);
}

#lightboxLabel{
  font-size:14px;
  opacity:.5;
  letter-spacing:1px;
}

#lightboxClose{
  position:absolute;
  top:20px; right:24px;
  background:none;
  border:none;
  color:white;
  font-size:32px;
  cursor:pointer;
  opacity:.6;
  transition:.2s;
}
#lightboxClose:hover{ opacity:1; }

/* MODALS */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  display:none;
  z-index:999;
  justify-content:center;
  align-items:center;
}

.modalBox{
  background:#111;
  border-radius:20px;
  padding:32px;
  width:480px;
  max-height:90vh;
  overflow-y:auto;
  border:1px solid rgba(255,255,255,.06);
}

.modalBox h2{ margin-bottom:22px; font-size:20px; letter-spacing:1px; }

.inputField{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:none;
  background:#1a1a1a;
  color:white;
  font-size:14px;
  margin-bottom:12px;
  outline:none;
  border:1px solid transparent;
  transition:.2s;
}
.inputField:focus{ border-color:rgba(124,92,255,.5); }

.dropZone{
  border:2px dashed rgba(255,255,255,.2);
  border-radius:14px;
  padding:28px;
  text-align:center;
  cursor:pointer;
  transition:.3s;
  margin-bottom:14px;
  font-size:14px;
}
.dropZone:hover{ border-color:rgba(255,255,255,.5); background:rgba(255,255,255,.03); }
.dropZone.over{ border-color:#7c5cff; background:rgba(124,92,255,.08); }
.dropZone p{ font-size:12px; opacity:.45; margin-top:6px; }

.previewRow{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:12px;
}

.previewThumb{
  width:64px; height:80px;
  border-radius:8px;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.1);
}

.progressBar{
  width:100%;
  height:4px;
  background:rgba(255,255,255,.08);
  border-radius:99px;
  overflow:hidden;
  margin-top:8px;
  display:none;
}
.progressFill{
  height:100%;
  background:#7c5cff;
  width:0%;
  transition:.3s;
}

.statusText{
  font-size:12px;
  opacity:.5;
  margin-top:6px;
  min-height:18px;
}

.btnRow{ display:flex; gap:10px; margin-top:16px; }

.btnPrimary{
  flex:1; padding:13px;
  border:none; border-radius:10px;
  background:#7c5cff; color:white;
  font-size:14px; cursor:pointer;
  transition:.2s;
}
.btnPrimary:hover{ background:#6a4dee; }
.btnPrimary:disabled{ opacity:.4; cursor:not-allowed; }

.btnSecondary{
  flex:1; padding:13px;
  border:none; border-radius:10px;
  background:#1e1e1e; color:white;
  font-size:14px; cursor:pointer;
  transition:.2s;
}
.btnSecondary:hover{ background:#2a2a2a; }

/* LOADING */
#loadingScreen{
  position:fixed;
  inset:0;
  background:#0a0a0a;
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:18px;
  letter-spacing:6px;
  transition:1s;
}
</style>
<audio id="bgMusic" style="display:none"></audio>
<script>
  const _src = localStorage.getItem("musicSrc")
  const _time = Number(localStorage.getItem("musicTime") || 0)
  if(_src){
    const a = document.getElementById("bgMusic")
    a.src = _src
    a.volume = 0.35
    a.currentTime = _time
    a.play().catch(()=>{})
    setInterval(()=>{ localStorage.setItem("musicTime", a.currentTime) }, 500)
  }
</script>
</head>
<body>

<div id="loadingScreen">FOTOCARDS</div>

<!-- NAV -->
<nav>
  <div class="navLeft">
    <button class="backBtn" id="backBtn" onclick="goBack()">←</button>
    <div>
      <div class="logo">FOTOCARDS</div>
      <div class="breadcrumb" id="breadcrumb">ÁLBUNS</div>
    </div>
  </div>
  <div class="navRight">
    <span id="adminBadge">ADMIN</span>
    <button class="navBtn navBtnPurple" id="addAlbumBtn" onclick="openAddAlbum()">+ ÁLBUM</button>
    <button class="navBtn navBtnPurple" id="addCardBtn" onclick="openAddCards()">+ FOTOCARDS</button>
    <button class="navBtn" id="removeCardBtn" onclick="toggleRemoveMode()">✏️ EDITAR</button>
    <a href="index.html" style="color:white;text-decoration:none;">
      <button class="navBtn">🎵 MÚSICAS</button>
    </a>
    <button class="navBtn" onclick="checkAdmin()">ADMIN</button>
  </div>
</nav>

<!-- ALBUM VIEW -->
<div id="albumView" class="active">
  <div class="pageHeader">
    <div>
      <div class="pageTitle">ÁLBUNS</div>
      <div class="pageSubtitle">SELECIONE UM ÁLBUM PARA VER OS FOTOCARDS</div>
    </div>
  </div>
  <div class="albumsGrid" id="albumsGrid"></div>
</div>

<!-- CARDS VIEW -->
<div id="cardsView">
  <div class="cardsHeader">
    <img class="albumCover" id="albumCoverImg">
    <div class="albumCoverPlaceholder" id="albumCoverPlaceholder">📸</div>
    <div class="albumTitleBlock">
      <h1 id="albumViewTitle">—</h1>
      <p id="albumViewMeta">—</p>
    </div>
  </div>
  <div class="cardsGrid" id="cardsGrid"></div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button id="lightboxClose" onclick="closeLightbox()">×</button>
  <img id="lightboxImg" src="">
  <div id="lightboxLabel"></div>
</div>

<!-- MODAL: ADD ALBUM -->
<div class="modal" id="addAlbumModal">
  <div class="modalBox">
    <h2>📁 Novo Álbum</h2>

    <label style="font-size:13px;opacity:.6;display:block;margin-bottom:6px;">Nome do álbum</label>
    <input class="inputField" id="albumName" placeholder="Ex: Proof (2022)">

    <label style="font-size:13px;opacity:.6;display:block;margin-bottom:6px;">Época / Ano</label>
    <input class="inputField" id="albumEra" placeholder="Ex: 2022">

    <label style="font-size:13px;opacity:.6;display:block;margin-bottom:6px;">Capa do álbum (opcional)</label>
    <div class="dropZone" id="albumCoverZone" onclick="document.getElementById('albumCoverInput').click()">
      🖼️ Arraste ou clique para selecionar
      <p id="albumCoverFileName">Nenhum arquivo</p>
    </div>
    <input type="file" id="albumCoverInput" accept="image/*" style="display:none">
    <img id="albumCoverPreview" style="width:80px;height:80px;border-radius:10px;object-fit:cover;display:none;margin-bottom:12px;">

    <div class="progressBar" id="albumProgress"><div class="progressFill" id="albumFill"></div></div>
    <div class="statusText" id="albumStatus"></div>

    <div class="btnRow">
      <button class="btnPrimary" id="saveAlbumBtn" onclick="submitAlbum()">CRIAR ÁLBUM</button>
      <button class="btnSecondary" onclick="closeModal('addAlbumModal')">CANCELAR</button>
    </div>
  </div>
</div>

<!-- MODAL: ADD CARDS -->
<div class="modal" id="addCardsModal">
  <div class="modalBox">
    <h2>🃏 Adicionar Fotocards</h2>

    <div class="dropZone" id="cardsDropZone" onclick="document.getElementById('cardsInput').click()">
      🖼️ Arraste as imagens aqui ou clique para selecionar
      <p>Você pode selecionar várias de uma vez</p>
    </div>
    <input type="file" id="cardsInput" accept="image/*" multiple style="display:none">

    <div class="previewRow" id="cardsPreviewRow"></div>

    <div class="progressBar" id="cardsProgress"><div class="progressFill" id="cardsFill"></div></div>
    <div class="statusText" id="cardsStatus"></div>

    <div class="btnRow">
      <button class="btnPrimary" id="saveCardsBtn" onclick="submitCards()">SALVAR FOTOCARDS</button>
      <button class="btnSecondary" onclick="closeModal('addCardsModal')">CANCELAR</button>
    </div>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js"
import { getDatabase, ref, onValue, push, remove, get } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js"

const firebaseConfig = {
  apiKey: "AIzaSyDFShfAw6VJ51hjka27gUebd9fna6o4yGw",
  authDomain: "bts-archive-63f8b.firebaseapp.com",
  databaseURL: "https://bts-archive-63f8b-default-rtdb.firebaseio.com",
  projectId: "bts-archive-63f8b",
  storageBucket: "bts-archive-63f8b.firebasestorage.app",
  messagingSenderId: "995910359395",
  appId: "1:995910359395:web:faa0858e7a44cf101f9b56"
}

const CLOUDINARY_CLOUD = "dlcg5zzes"
const CLOUDINARY_PRESET = "bts_upload"

const app = initializeApp(firebaseConfig)
const db = getDatabase(app)
const albumsRef = ref(db, "fotocards")

// Estado
let albums = {}
let currentAlbumId = null
let isAdmin = false
let removeMode = false
let cardFiles = []
let albumCoverFile = null

// Carregar álbuns
onValue(albumsRef, (snapshot) => {
  albums = {}
  if(snapshot.exists()){
    snapshot.forEach(child => {
      albums[child.key] = { id: child.key, ...child.val() }
    })
  }
  renderAlbums()
  if(currentAlbumId && albums[currentAlbumId]){
    renderCards(currentAlbumId)
  }

  // Hide loading
  document.getElementById("loadingScreen").style.opacity = "0"
  setTimeout(()=>{ document.getElementById("loadingScreen").style.display = "none" }, 1000)
})

// ─── RENDER ALBUMS ───────────────────────────────────────────
function renderAlbums(){
  const grid = document.getElementById("albumsGrid")
  const list = Object.values(albums)

  if(list.length === 0){
    grid.innerHTML = `
      <div class="emptyState" style="grid-column:1/-1">
        <div class="emptyIcon">📂</div>
        <p>${isAdmin ? "Clique em + ÁLBUM para criar o primeiro." : "Nenhum álbum ainda."}</p>
      </div>`
    return
  }

  grid.innerHTML = list.map(album => {
    const cards = album.cards ? Object.values(album.cards) : []
    const coverHtml = album.cover
      ? `<img src="${album.cover}" onerror="this.style.display='none'">`
      : `<div class="albumCardPlaceholder">📸</div>`

    return `
      <div class="albumCard" onclick="openAlbum('${album.id}')">
        ${coverHtml}
        <div class="albumInfo">
          <div class="albumName">${album.name}</div>
          <div class="albumMeta">${album.era || ''} · ${cards.length} fotocard${cards.length !== 1 ? 's' : ''}</div>
        </div>
        <button class="albumRemoveBtn" id="rmAlbum_${album.id}"
          onclick="event.stopPropagation(); removeAlbum('${album.id}')">×</button>
      </div>`
  }).join("")

  updateRemoveBtns()
}

// ─── RENDER CARDS ────────────────────────────────────────────
function renderCards(albumId){
  const album = albums[albumId]
  if(!album) return

  const grid = document.getElementById("cardsGrid")
  const cards = album.cards ? Object.values(album.cards) : []

  // Header
  document.getElementById("albumViewTitle").innerText = album.name
  document.getElementById("albumViewMeta").innerText = `${album.era || ''} · ${cards.length} fotocards`

  if(album.cover){
    document.getElementById("albumCoverImg").src = album.cover
    document.getElementById("albumCoverImg").style.display = "block"
    document.getElementById("albumCoverPlaceholder").style.display = "none"
  } else {
    document.getElementById("albumCoverImg").style.display = "none"
    document.getElementById("albumCoverPlaceholder").style.display = "flex"
  }

  if(cards.length === 0){
    grid.innerHTML = `
      <div class="emptyState" style="grid-column:1/-1">
        <div class="emptyIcon">🃏</div>
        <p>${isAdmin ? "Clique em + FOTOCARDS para adicionar." : "Nenhum fotocard ainda."}</p>
      </div>`
    return
  }

  grid.innerHTML = cards.map(card => `
    <div class="photoCard" onclick="openLightbox('${card.url}', '${(card.label||'').replace(/'/g,"\\'")}')">
      <img src="${card.url}" loading="lazy" onerror="this.src='https://via.placeholder.com/160x240?text=erro'">
      ${card.label ? `<div class="photoCardLabel">${card.label}</div>` : ''}
      <button class="cardRemoveBtn" id="rmCard_${card.id}"
        onclick="event.stopPropagation(); removeCard('${albumId}','${card.id}')">×</button>
    </div>`
  ).join("")

  updateRemoveBtns()
}

// ─── NAVIGATION ──────────────────────────────────────────────
window.openAlbum = (albumId) => {
  currentAlbumId = albumId
  document.getElementById("albumView").classList.remove("active")
  document.getElementById("cardsView").classList.add("active")
  document.getElementById("backBtn").style.display = "block"
  document.getElementById("breadcrumb").innerText = albums[albumId]?.name || "FOTOCARDS"
  if(isAdmin){
    document.getElementById("addAlbumBtn").style.display = "none"
    document.getElementById("addCardBtn").style.display = "block"
    document.getElementById("removeCardBtn").style.display = "block"
  }
  renderCards(albumId)
}

window.goBack = () => {
  currentAlbumId = null
  removeMode = false
  document.getElementById("albumView").classList.add("active")
  document.getElementById("cardsView").classList.remove("active")
  document.getElementById("backBtn").style.display = "none"
  document.getElementById("breadcrumb").innerText = "ÁLBUNS"
  if(isAdmin){
    document.getElementById("addAlbumBtn").style.display = "block"
    document.getElementById("addCardBtn").style.display = "none"
    document.getElementById("removeCardBtn").style.display = "none"
    document.getElementById("removeCardBtn").innerText = "✏️ EDITAR"
  }
}

// ─── LIGHTBOX ────────────────────────────────────────────────
window.openLightbox = (url, label) => {
  document.getElementById("lightboxImg").src = url
  document.getElementById("lightboxLabel").innerText = label || ""
  document.getElementById("lightbox").classList.add("open")
}

window.closeLightbox = () => {
  document.getElementById("lightbox").classList.remove("open")
}

document.getElementById("lightbox").addEventListener("click", (e) => {
  if(e.target === document.getElementById("lightbox")) closeLightbox()
})

// ─── ADMIN ───────────────────────────────────────────────────
window.checkAdmin = () => {
  const key = prompt("Admin key:")
  if(key === "12345"){
    isAdmin = true
    document.getElementById("adminBadge").style.display = "block"
    document.getElementById("addAlbumBtn").style.display = "block"
    if(currentAlbumId){
      document.getElementById("addAlbumBtn").style.display = "none"
      document.getElementById("addCardBtn").style.display = "block"
      document.getElementById("removeCardBtn").style.display = "block"
    }
    updateRemoveBtns()
    alert("Modo admin ativado!")
  } else {
    alert("Acesso negado")
  }
}

window.toggleRemoveMode = () => {
  removeMode = !removeMode
  document.getElementById("removeCardBtn").innerText = removeMode ? "✅ PRONTO" : "✏️ EDITAR"
  updateRemoveBtns()
}

function updateRemoveBtns(){
  // album remove buttons (always show in admin on album view)
  document.querySelectorAll('[id^="rmAlbum_"]').forEach(btn => {
    btn.style.display = isAdmin ? "flex" : "none"
  })
  // card remove buttons (show only in remove mode)
  document.querySelectorAll('[id^="rmCard_"]').forEach(btn => {
    btn.style.display = (isAdmin && removeMode) ? "flex" : "none"
  })
}

// ─── ADD ALBUM ───────────────────────────────────────────────
window.openAddAlbum = () => {
  albumCoverFile = null
  document.getElementById("albumName").value = ""
  document.getElementById("albumEra").value = ""
  document.getElementById("albumCoverFileName").innerText = "Nenhum arquivo"
  document.getElementById("albumCoverPreview").style.display = "none"
  document.getElementById("albumStatus").innerText = ""
  document.getElementById("albumProgress").style.display = "none"
  openModal("addAlbumModal")
}

// Drag & drop para capa do álbum
setupDrop("albumCoverZone", "albumCoverInput", "image", (file) => {
  albumCoverFile = file
  document.getElementById("albumCoverFileName").innerText = file.name
  const prev = document.getElementById("albumCoverPreview")
  prev.src = URL.createObjectURL(file)
  prev.style.display = "block"
})

window.submitAlbum = async () => {
  const name = document.getElementById("albumName").value.trim()
  const era = document.getElementById("albumEra").value.trim()
  if(!name){ alert("Nome do álbum é obrigatório!"); return }

  const btn = document.getElementById("saveAlbumBtn")
  btn.disabled = true
  const status = document.getElementById("albumStatus")
  const progress = document.getElementById("albumProgress")
  const fill = document.getElementById("albumFill")

  try {
    let coverUrl = ""
    if(albumCoverFile){
      progress.style.display = "block"
      status.innerText = "Enviando capa..."
      coverUrl = await uploadToCloudinary(albumCoverFile, "image", p => fill.style.width = p + "%")
    }

    await push(albumsRef, { name, era, cover: coverUrl, cards: {} })
    status.innerText = "✅ Álbum criado!"
    setTimeout(() => closeModal("addAlbumModal"), 1200)
  } catch(err){
    status.innerText = "❌ Erro ao criar álbum."
    console.error(err)
  }
  btn.disabled = false
}

window.removeAlbum = async (albumId) => {
  if(!confirm(`Remover o álbum "${albums[albumId]?.name}" e todos os fotocards?`)) return
  await remove(ref(db, "fotocards/" + albumId))
}

// ─── ADD CARDS ───────────────────────────────────────────────
window.openAddCards = () => {
  cardFiles = []
  document.getElementById("cardsPreviewRow").innerHTML = ""
  document.getElementById("cardsStatus").innerText = ""
  document.getElementById("cardsProgress").style.display = "none"
  document.getElementById("cardsFill").style.width = "0%"
  openModal("addCardsModal")
}

// Drop zone para cards (múltiplos)
const cardsDropZone = document.getElementById("cardsDropZone")
const cardsInput = document.getElementById("cardsInput")

cardsDropZone.addEventListener("dragover", (e) => { e.preventDefault(); cardsDropZone.classList.add("over") })
cardsDropZone.addEventListener("dragleave", () => cardsDropZone.classList.remove("over"))
cardsDropZone.addEventListener("drop", (e) => {
  e.preventDefault()
  cardsDropZone.classList.remove("over")
  handleCardFiles(Array.from(e.dataTransfer.files))
})
cardsInput.addEventListener("change", () => handleCardFiles(Array.from(cardsInput.files)))

function handleCardFiles(files){
  cardFiles = [...cardFiles, ...files.filter(f => f.type.startsWith("image/"))]
  renderCardsPreview()
}

function renderCardsPreview(){
  const row = document.getElementById("cardsPreviewRow")
  row.innerHTML = cardFiles.map((f, i) => `
    <img class="previewThumb" src="${URL.createObjectURL(f)}" title="${f.name}">
  `).join("")
  document.getElementById("cardsStatus").innerText = `${cardFiles.length} imagem(ns) selecionada(s)`
}

window.submitCards = async () => {
  if(!cardFiles.length){ alert("Selecione pelo menos uma imagem!"); return }
  if(!currentAlbumId){ alert("Erro: nenhum álbum selecionado."); return }

  const btn = document.getElementById("saveCardsBtn")
  btn.disabled = true
  const status = document.getElementById("cardsStatus")
  const progress = document.getElementById("cardsProgress")
  const fill = document.getElementById("cardsFill")
  progress.style.display = "block"

  const cardsRef = ref(db, `fotocards/${currentAlbumId}/cards`)

  try {
    for(let i = 0; i < cardFiles.length; i++){
      const file = cardFiles[i]
      status.innerText = `Enviando ${i+1} de ${cardFiles.length}...`
      const url = await uploadToCloudinary(file, "image", p => {
        fill.style.width = ((i / cardFiles.length + p / 100 / cardFiles.length) * 100) + "%"
      })
      await push(cardsRef, { url, label: file.name.replace(/\.[^.]+$/, "") })
    }

    fill.style.width = "100%"
    status.innerText = `✅ ${cardFiles.length} fotocard(s) adicionado(s)!`
    cardFiles = []
    setTimeout(() => closeModal("addCardsModal"), 1500)
  } catch(err){
    status.innerText = "❌ Erro no upload."
    console.error(err)
  }
  btn.disabled = false
}

window.removeCard = async (albumId, cardId) => {
  await remove(ref(db, `fotocards/${albumId}/cards/${cardId}`))
}

// ─── CLOUDINARY ──────────────────────────────────────────────
async function uploadToCloudinary(file, type, onProgress){
  return new Promise((resolve, reject) => {
    const formData = new FormData()
    formData.append("file", file)
    formData.append("upload_preset", CLOUDINARY_PRESET)

    const xhr = new XMLHttpRequest()
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`)
    xhr.upload.onprogress = (e) => {
      if(e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100))
    }
    xhr.onload = () => {
      const res = JSON.parse(xhr.responseText)
      if(res.secure_url) resolve(res.secure_url)
      else reject(res)
    }
    xhr.onerror = reject
    xhr.send(formData)
  })
}

// ─── DROP HELPER ─────────────────────────────────────────────
function setupDrop(zoneId, inputId, type, onFile){
  const zone = document.getElementById(zoneId)
  const input = document.getElementById(inputId)
  zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("over") })
  zone.addEventListener("dragleave", () => zone.classList.remove("over"))
  zone.addEventListener("drop", (e) => {
    e.preventDefault()
    zone.classList.remove("over")
    const file = e.dataTransfer.files[0]
    if(file) onFile(file)
  })
  input.addEventListener("change", () => { if(input.files[0]) onFile(input.files[0]) })
}

// ─── MODAL HELPERS ───────────────────────────────────────────
window.openModal = (id) => { document.getElementById(id).style.display = "flex" }
window.closeModal = (id) => { document.getElementById(id).style.display = "none" }

</script>
