<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FOTOCARDS</title>
<style>

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  font-family:Arial;
  background:#08080f;
  color:white;
  min-height:100vh;
}

/* NAV */
nav{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  border-bottom:1px solid rgba(255,255,255,.07);
  position:sticky;
  top:0;
  background:#08080f;
  z-index:100;
}

.nav-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.back-btn{
  cursor:pointer;
  font-size:20px;
  opacity:.5;
  transition:.2s;
  line-height:1;
}
.back-btn:hover{ opacity:1; }

.nav-title{
  font-size:17px;
  font-weight:bold;
  letter-spacing:1px;
}

.nav-right{
  display:flex;
  gap:10px;
  align-items:center;
}

.pill{
  padding:9px 18px;
  border-radius:99px;
  border:none;
  cursor:pointer;
  font-size:13px;
  font-weight:bold;
  letter-spacing:.5px;
  transition:.2s;
}
.pill:hover{ transform:scale(1.04); }
.pill-fav{ background:#7c1f2e; color:white; }
.pill-admin{ background:#1a1a4a; color:white; }
.pill-admin.active{ background:#2d2d8a; }

/* PAGE */
.page{ padding:32px 28px; }

.page-header{
  margin-bottom:28px;
}

.page-header h2{
  font-size:22px;
  font-weight:bold;
}

.page-header .sub{
  font-size:13px;
  opacity:.35;
  margin-top:4px;
  letter-spacing:1px;
}

/* ÁLBUNS GRID */
.albums-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, 190px);
  gap:20px;
}

.album-card{
  width:190px;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  position:relative;
  background:#111120;
  border:1px solid rgba(255,255,255,.06);
  transition:.3s;
}
.album-card:hover{
  transform:translateY(-5px);
  border-color:rgba(255,255,255,.16);
  box-shadow:0 16px 50px rgba(0,0,0,.5);
}

.album-thumb{
  width:190px;
  height:190px;
  object-fit:cover;
  display:block;
}

.album-thumb-placeholder{
  width:190px;
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  background:rgba(255,255,255,.04);
}

.album-info{
  padding:12px 14px 14px;
}

.album-name{
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.album-sub{
  font-size:12px;
  opacity:.35;
  margin-top:3px;
}

.album-del{
  position:absolute;
  top:8px; right:8px;
  width:26px; height:26px;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  border:1px solid rgba(255,255,255,.15);
  color:white;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  opacity:0;
  transition:.2s;
}
.album-card:hover .album-del{ opacity:1; }
.album-del:hover{ background:rgba(200,0,0,.6); }

/* ADD CARD (álbum ou foto) */
.add-card{
  width:190px;
  border-radius:16px;
  border:2px dashed rgba(255,255,255,.12);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:rgba(255,255,255,.3);
  font-size:13px;
  gap:10px;
  transition:.3s;
}
.add-card:hover{
  border-color:rgba(255,255,255,.3);
  color:rgba(255,255,255,.6);
  background:rgba(255,255,255,.03);
}
.add-card .plus{
  font-size:32px;
  line-height:1;
}
/* height para álbum igual ao card */
.albums-grid .add-card{ height:242px; width:190px; }
/* height para fotocard igual ao card */
.cards-grid .add-card{ height:249px; width:150px; }
.cards-section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}
.cards-count{ font-size:13px; opacity:.3; letter-spacing:1px; }

.cards-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, 150px);
  gap:14px;
}

.fotocard{
  width:150px;
  border-radius:14px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.06);
  transition:.3s;
  background:#111120;
}
.fotocard:hover{
  transform:translateY(-5px) scale(1.03);
  border-color:rgba(255,255,255,.2);
  box-shadow:0 14px 40px rgba(0,0,0,.5);
}

.fotocard img{
  width:150px;
  height:225px;
  object-fit:cover;
  display:block;
}

.fotocard-label{
  padding:8px 10px;
  font-size:11px;
  opacity:.5;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.fotocard-del{
  position:absolute;
  top:6px; right:6px;
  width:24px; height:24px;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  border:1px solid rgba(255,255,255,.15);
  color:white;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  opacity:0;
  transition:.2s;
}
.fotocard:hover .fotocard-del{ opacity:1; }
.fotocard-del:hover{ background:rgba(200,0,0,.6); }

/* LIGHTBOX */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.94);
  z-index:9999;
  display:none;
  justify-content:center;
  align-items:center;
}
.lightbox.open{ display:flex; }

.lb-img{
  max-height:88vh;
  max-width:85vw;
  border-radius:14px;
  object-fit:contain;
}

.lb-close{
  position:absolute;
  top:18px; right:22px;
  font-size:26px;
  cursor:pointer;
  opacity:.4;
  transition:.2s;
}
.lb-close:hover{ opacity:1; }

.lb-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:48px;
  cursor:pointer;
  opacity:.3;
  user-select:none;
  transition:.2s;
  padding:10px;
}
.lb-arrow:hover{ opacity:.9; }
.lb-prev{ left:16px; }
.lb-next{ right:16px; }

.lb-info{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  opacity:.35;
  letter-spacing:2px;
  white-space:nowrap;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:99999;
  display:none;
  justify-content:center;
  align-items:center;
}
.modal.open{ display:flex; }

.modal-box{
  background:#0f0f1e;
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:30px;
  width:440px;
  max-height:92vh;
  overflow-y:auto;
}
.modal-box h2{ font-size:17px; margin-bottom:20px; }

.field{
  width:100%;
  padding:12px 15px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.05);
  color:white;
  font-size:14px;
  margin-bottom:12px;
  outline:none;
  transition:.2s;
}
.field:focus{ border-color:rgba(124,92,255,.5); }

.drop{
  border:2px dashed rgba(255,255,255,.12);
  border-radius:12px;
  padding:26px;
  text-align:center;
  cursor:pointer;
  transition:.3s;
  margin-bottom:12px;
}
.drop:hover{ border-color:#7c5cff; background:rgba(124,92,255,.05); }
.drop.over{ border-color:#7c5cff; background:rgba(124,92,255,.1); }
.drop p{ font-size:12px; opacity:.35; margin-top:6px; }

.drop-preview{
  width:70px; height:70px;
  border-radius:8px;
  object-fit:cover;
  margin-top:10px;
  display:none;
}

.sel{
  width:100%;
  padding:12px 15px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.05);
  color:white;
  font-size:14px;
  margin-bottom:12px;
  outline:none;
  appearance:none;
  cursor:pointer;
}
.sel option{ background:#0f0f1e; }

.btn-row{ display:flex; gap:10px; margin-top:12px; }
.btn-row button{
  flex:1;
  padding:13px;
  border:none;
  border-radius:10px;
  font-size:14px;
  cursor:pointer;
  transition:.2s;
}
.btn-row button:hover{ transform:scale(1.03); }
.b-save{ background:#7c5cff; color:white; }
.b-cancel{ background:rgba(255,255,255,.07); color:white; }

.prog-bar{
  width:100%;
  height:3px;
  background:rgba(255,255,255,.07);
  border-radius:99px;
  overflow:hidden;
  margin-top:8px;
  display:none;
}
.prog-fill{ height:100%; background:#7c5cff; width:0%; transition:.3s; }
.status{ font-size:12px; opacity:.4; margin-top:6px; min-height:16px; }

/* LOADING */
#ls{
  position:fixed;
  inset:0;
  background:#08080f;
  z-index:99999;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:16px;
  letter-spacing:6px;
  opacity:1;
  transition:1s;
}

</style>
</head>
<body>

<div id="ls">LOADING</div>

<nav>
  <div class="nav-left">
    <span class="back-btn" id="backBtn" onclick="goBack()">←</span>
    <span class="nav-title" id="navTitle">Fotocards</span>
  </div>
  <div class="nav-right">
    <button class="pill pill-fav">♥ Favoritos</button>
    <button class="pill pill-admin" id="adminPill" onclick="toggleAdmin()">Admin</button>
  </div>
</nav>

<div class="page">
  <div class="page-header" id="pageHeader">
    <h2>Álbuns &amp; Eras</h2>
  </div>
  <div id="mainContent"></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="lbClickBg(event)">
  <span class="lb-close" onclick="closeLb()">✕</span>
  <span class="lb-arrow lb-prev" onclick="lbGo(-1)">‹</span>
  <img class="lb-img" id="lbImg">
  <span class="lb-arrow lb-next" onclick="lbGo(1)">›</span>
  <span class="lb-info" id="lbInfo"></span>
</div>

<!-- MODAL ÁLBUM -->
<div class="modal" id="mAlbum" onclick="modalBg(event,'mAlbum')">
  <div class="modal-box">
    <h2>➕ Novo Álbum</h2>
    <input class="field" id="aName" placeholder="Nome do álbum">
    <input class="field" id="aArtist" placeholder="Artista (ex: BTS)">
    <input class="field" id="aYear" placeholder="Ano (ex: 2021)">
    <div class="drop" id="aDrop" onclick="document.getElementById('aFile').click()">
      🖼️ Capa do álbum
      <p id="aFileName">Nenhum arquivo selecionado</p>
      <img class="drop-preview" id="aPreview">
    </div>
    <input type="file" id="aFile" accept="image/*" style="display:none">
    <div class="prog-bar" id="aBar"><div class="prog-fill" id="aFill"></div></div>
    <p class="status" id="aStatus"></p>
    <div class="btn-row">
      <button class="b-save" onclick="submitAlbum()">SALVAR</button>
      <button class="b-cancel" onclick="closeModal('mAlbum')">CANCELAR</button>
    </div>
  </div>
</div>

<!-- MODAL FOTOCARD -->
<div class="modal" id="mCard" onclick="modalBg(event,'mCard')">
  <div class="modal-box">
    <h2>🃏 Adicionar Fotocard</h2>
    <select class="sel" id="cAlbum"></select>
    <input class="field" id="cName" placeholder="Nome / descrição (ex: Jungkook ver. A)">
    <div class="drop" id="cDrop" onclick="document.getElementById('cFile').click()">
      🖼️ Imagem do fotocard
      <p id="cFileName">Nenhum arquivo selecionado</p>
      <img class="drop-preview" id="cPreview">
    </div>
    <input type="file" id="cFile" accept="image/*" style="display:none">
    <div class="prog-bar" id="cBar"><div class="prog-fill" id="cFill"></div></div>
    <p class="status" id="cStatus"></p>
    <div class="btn-row">
      <button class="b-save" onclick="submitCard()">SALVAR</button>
      <button class="b-cancel" onclick="closeModal('mCard')">CANCELAR</button>
    </div>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js"
import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js"

const firebaseConfig = {
  apiKey: "AIzaSyDFShfAw6VJ51hjka27gUebd9fna6o4yGw",
  authDomain: "bts-archive-63f8b.firebaseapp.com",
  databaseURL: "https://bts-archive-63f8b-default-rtdb.firebaseio.com",
  projectId: "bts-archive-63f8b",
  storageBucket: "bts-archive-63f8b.firebasestorage.app",
  messagingSenderId: "995910359395",
  appId: "1:995910359395:web:faa0858e7a44cf101f9b56"
}

const app = initializeApp(firebaseConfig)
const db = getDatabase(app)
const albumsRef = ref(db, "albums")
const cardsRef  = ref(db, "fotocards")

const CC = "dlcg5zzes"
const CP = "bts_upload"

let albums    = []
let fotocards = []
let curAlbum  = null
let isAdmin   = localStorage.getItem("isAdmin") === "true"
let aFile = null, cFile = null
let lbList = [], lbIdx = 0

// admin pill state
function refreshAdminPill(){
  const p = document.getElementById("adminPill")
  if(isAdmin){ p.innerText = "✓ Admin"; p.classList.add("active") }
  else { p.innerText = "Admin"; p.classList.remove("active") }
}
refreshAdminPill()

// firebase listeners
onValue(albumsRef, snap => {
  albums = []
  snap.forEach(c => albums.push({ id:c.key, ...c.val() }))
  render()
})

onValue(cardsRef, snap => {
  fotocards = []
  snap.forEach(c => fotocards.push({ id:c.key, ...c.val() }))
  document.getElementById("ls").style.opacity = "0"
  setTimeout(() => document.getElementById("ls").style.display = "none", 1000)
  render()
})

function render(){
  if(curAlbum) renderCards()
  else         renderAlbums()
}

/* ---- ÁLBUNS ---- */
function renderAlbums(){
  document.getElementById("navTitle").innerText = "Fotocards"
  document.getElementById("pageHeader").innerHTML = "<h2>Álbuns &amp; Eras</h2>"

  let html = '<div class="albums-grid">'

  albums.forEach(a => {
    const count = fotocards.filter(c => c.albumId === a.id).length
    const thumb = a.cover
      ? `<img class="album-thumb" src="${a.cover}">`
      : `<div class="album-thumb-placeholder">📀</div>`
    const del = isAdmin
      ? `<div class="album-del" onclick="delAlbum(event,'${a.id}')">✕</div>`
      : ""
    html += `
      <div class="album-card" onclick="openAlbum('${a.id}')">
        ${thumb}${del}
        <div class="album-info">
          <div class="album-name">${a.name}</div>
          <div class="album-sub">${a.artist || "BTS"}${a.year ? " · " + a.year : ""}</div>
        </div>
      </div>`
  })

  if(isAdmin){
    html += `
      <div class="add-card" onclick="openAddAlbum()">
        <span class="plus">+</span>
        <span>Novo Álbum</span>
      </div>`
  }

  html += "</div>"
  document.getElementById("mainContent").innerHTML = html
}

window.openAlbum = function(id){
  curAlbum = id
  renderCards()
}

/* ---- FOTOCARDS ---- */
function renderCards(){
  const album = albums.find(a => a.id === curAlbum)
  if(!album){ curAlbum = null; renderAlbums(); return }

  const cards = fotocards.filter(c => c.albumId === curAlbum)
  lbList = cards

  document.getElementById("navTitle").innerText = album.name
  document.getElementById("pageHeader").innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;">
      <span style="cursor:pointer;opacity:.5;font-size:20px;" onclick="goBackToAlbums()">←</span>
      <h2>${album.name}</h2>
      <span class="cards-count">${cards.length} fotocards</span>
    </div>`

  let html = '<div class="cards-grid">'

  cards.forEach((c, i) => {
    const del = isAdmin
      ? `<div class="fotocard-del" onclick="delCard(event,'${c.id}')">✕</div>`
      : ""
    html += `
      <div class="fotocard" onclick="openLb(${i})">
        <img src="${c.img}" onerror="this.src='https://via.placeholder.com/150x225'">
        ${del}
        ${c.name ? `<div class="fotocard-label">${c.name}</div>` : ""}
      </div>`
  })

  if(isAdmin){
    html += `
      <div class="add-card" onclick="openAddCard()">
        <span class="plus">+</span>
        <span>Adicionar fotos</span>
      </div>`
  }

  html += "</div>"
  document.getElementById("mainContent").innerHTML = html
}

/* ---- NAV ---- */
window.goBack = function(){
  if(curAlbum){ curAlbum = null; renderAlbums() }
  else { window.location.href = "home.html" }
}

window.goBackToAlbums = function(){
  curAlbum = null; renderAlbums()
}

/* ---- ADMIN ---- */
window.toggleAdmin = function(){
  if(isAdmin){
    isAdmin = false
    localStorage.removeItem("isAdmin")
    refreshAdminPill()
    render()
    return
  }
  const key = prompt("Admin key:")
  if(key === "12345"){
    isAdmin = true
    localStorage.setItem("isAdmin","true")
    refreshAdminPill()
    render()
  } else if(key !== null){
    alert("Acesso negado")
  }
}

/* ---- CLOUDINARY ---- */
async function upload(file, onProg){
  return new Promise((res, rej) => {
    const fd = new FormData()
    fd.append("file", file)
    fd.append("upload_preset", CP)
    const xhr = new XMLHttpRequest()
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${CC}/image/upload`)
    xhr.upload.onprogress = e => { if(e.lengthComputable) onProg(Math.round(e.loaded/e.total*100)) }
    xhr.onload = () => {
      const r = JSON.parse(xhr.responseText)
      r.secure_url ? res(r.secure_url) : rej(r)
    }
    xhr.onerror = rej
    xhr.send(fd)
  })
}

/* ---- DROP ZONES ---- */
function setupDrop(dropId, fileId, previewId, nameId, onFile){
  const drop = document.getElementById(dropId)
  const inp  = document.getElementById(fileId)
  drop.addEventListener("dragover",  e => { e.preventDefault(); drop.classList.add("over") })
  drop.addEventListener("dragleave", ()  => drop.classList.remove("over"))
  drop.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("over")
    if(e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0])
  })
  inp.addEventListener("change", () => { if(inp.files[0]) onFile(inp.files[0]) })
}

setupDrop("aDrop","aFile","aPreview","aFileName", f => {
  aFile = f
  document.getElementById("aFileName").innerText = f.name
  const p = document.getElementById("aPreview")
  p.src = URL.createObjectURL(f); p.style.display = "block"
})

setupDrop("cDrop","cFile","cPreview","cFileName", f => {
  cFile = f
  document.getElementById("cFileName").innerText = f.name
  const p = document.getElementById("cPreview")
  p.src = URL.createObjectURL(f); p.style.display = "block"
})

/* ---- ÁLBUM MODAL ---- */
window.openAddAlbum = function(){
  aFile = null
  ;["aName","aArtist","aYear"].forEach(id => document.getElementById(id).value = "")
  document.getElementById("aFileName").innerText = "Nenhum arquivo selecionado"
  document.getElementById("aPreview").style.display = "none"
  document.getElementById("aStatus").innerText = ""
  document.getElementById("aBar").style.display = "none"
  openModal("mAlbum")
}

window.submitAlbum = async function(){
  const name = document.getElementById("aName").value.trim()
  if(!name){ alert("Coloque o nome do álbum!"); return }
  const bar = document.getElementById("aBar")
  const fill = document.getElementById("aFill")
  const status = document.getElementById("aStatus")
  let cover = ""
  try {
    if(aFile){
      bar.style.display = "block"; status.innerText = "Enviando capa..."
      cover = await upload(aFile, p => fill.style.width = p + "%")
    }
    await push(albumsRef, {
      name,
      artist: document.getElementById("aArtist").value.trim() || "BTS",
      year:   document.getElementById("aYear").value.trim(),
      cover
    })
    status.innerText = "✅ Álbum criado!"
    fill.style.width = "100%"
    setTimeout(() => closeModal("mAlbum"), 1200)
  } catch(e){ status.innerText = "❌ Erro. Tente novamente."; console.error(e) }
}

window.delAlbum = function(e, id){
  e.stopPropagation()
  if(!confirm("Remover este álbum e todos os fotocards?")) return
  remove(ref(db,"albums/"+id))
  fotocards.filter(c => c.albumId === id).forEach(c => remove(ref(db,"fotocards/"+c.id)))
}

/* ---- CARD MODAL ---- */
window.openAddCard = function(){
  cFile = null
  document.getElementById("cName").value = ""
  document.getElementById("cFileName").innerText = "Nenhum arquivo selecionado"
  document.getElementById("cPreview").style.display = "none"
  document.getElementById("cStatus").innerText = ""
  document.getElementById("cBar").style.display = "none"
  const sel = document.getElementById("cAlbum")
  sel.innerHTML = albums.map(a => `<option value="${a.id}">${a.name}</option>`).join("")
  if(curAlbum) sel.value = curAlbum
  openModal("mCard")
}

window.submitCard = async function(){
  const albumId = document.getElementById("cAlbum").value
  if(!albumId || !cFile){ alert("Selecione o álbum e a imagem!"); return }
  const bar = document.getElementById("cBar")
  const fill = document.getElementById("cFill")
  const status = document.getElementById("cStatus")
  try {
    bar.style.display = "block"; status.innerText = "Enviando imagem..."
    const img = await upload(cFile, p => fill.style.width = p + "%")
    await push(cardsRef, { albumId, name: document.getElementById("cName").value.trim(), img })
    status.innerText = "✅ Fotocard adicionado!"
    fill.style.width = "100%"
    setTimeout(() => closeModal("mCard"), 1200)
  } catch(e){ status.innerText = "❌ Erro. Tente novamente."; console.error(e) }
}

window.delCard = function(e, id){
  e.stopPropagation()
  if(!confirm("Remover este fotocard?")) return
  remove(ref(db,"fotocards/"+id))
}

/* ---- LIGHTBOX ---- */
window.openLb = function(i){
  lbIdx = i; updateLb()
  document.getElementById("lightbox").classList.add("open")
}
window.closeLb = () => document.getElementById("lightbox").classList.remove("open")
window.lbClickBg = e => { if(e.target === document.getElementById("lightbox")) closeLb() }
window.lbGo = function(dir){
  lbIdx = (lbIdx + dir + lbList.length) % lbList.length
  updateLb()
}
function updateLb(){
  const c = lbList[lbIdx]
  document.getElementById("lbImg").src = c.img
  document.getElementById("lbInfo").innerText = (c.name || "") + " · " + (lbIdx+1) + " / " + lbList.length
}
document.addEventListener("keydown", e => {
  const lb = document.getElementById("lightbox")
  if(!lb.classList.contains("open")) return
  if(e.key === "ArrowLeft")  lbGo(-1)
  if(e.key === "ArrowRight") lbGo(1)
  if(e.key === "Escape")     closeLb()
})

/* ---- MODAL HELPERS ---- */
window.openModal  = id => document.getElementById(id).classList.add("open")
window.closeModal = id => document.getElementById(id).classList.remove("open")
window.modalBg    = (e, id) => { if(e.target === document.getElementById(id)) closeModal(id) }

</script>
