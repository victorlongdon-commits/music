<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>BTS Archive</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
background:linear-gradient(180deg,#08080b,#14142b);
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.box{
width:500px;
padding:60px;
border-radius:30px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(30px);
text-align:center;
}

h1{
font-size:60px;
margin-bottom:20px;
}

p{
opacity:.7;
margin-bottom:30px;
}

input{
width:100%;
padding:20px;
border:none;
border-radius:20px;
margin-bottom:20px;
font-size:18px;
}

button{
width:100%;
padding:20px;
border:none;
border-radius:20px;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
}

</style>
</head>

<body>

<div class="box">
  <h1>BTS ARCHIVE</h1>
  <p>Enter your name</p>
  <input id="username" placeholder="Name">
  <button onclick="enter()">ENTER</button>
</div>

<script>

// Se já entrou antes, vai direto pro home
if(localStorage.getItem("jaEntrou")){
  window.location.href = "home.html"
}

function enter(){
  let name = document.getElementById("username").value
  if(!name) return

  localStorage.setItem("user", name)
  localStorage.setItem("userName", name)
  window.location.href = "welcome.html"
}

</script>

</body>
</html>
